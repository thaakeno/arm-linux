name: Vessel Direct KWin

on:
  workflow_dispatch:
  push:
    branches:
      - fix/vessel-direct-transport-no-fallback
    paths:
      - 'tools/vessel_proroot/patch_kwin_direct_transport.py'
      - '.github/workflows/vessel-kwin-direct.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: debian:trixie
      options: --privileged --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get build-dep -y kwin
          apt-get install -y --no-install-recommends \
            git build-essential devscripts fakeroot quilt git-buildpackage pristine-tar \
            zip gh

      - name: Clone pinned Anland KWin
        shell: bash
        run: |
          set -euxo pipefail
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git clone https://github.com/lfdevs/kwin.git /work/kwin
          cd /work/kwin
          git checkout beea4c3d22f08100b1b3acda1bd502e87bb1a347
          git switch -c vessel-direct
          # lfdevs/kwin is Debian packaging with pristine upstream source tarballs.
          # Materialize the upstream tree before applying the quilt series.
          origtargz
          # Match lfdevs' own package CI: materialize the pristine upstream tree
          # into git so gbp sees a complete, clean source package.
          git add .
          git commit -m "Materialize KWin upstream source"

      - name: Apply Vessel direct-transport patch
        shell: bash
        run: |
          set -euxo pipefail
          cd /work/kwin
          export QUILT_PATCHES=debian/patches
          quilt push -a || true
          quilt new 0006-vessel-direct-transport-no-fallback.patch
          quilt add \
            src/backends/anland/display_producer.c \
            src/backends/anland/anland_backend.cpp \
            src/backends/anland/anland_egl_backend.cpp
          python3 "$GITHUB_WORKSPACE/tools/vessel_proroot/patch_kwin_direct_transport.py" /work/kwin
          quilt refresh
          grep -Fqx '0006-vessel-direct-transport-no-fallback.patch' debian/patches/series || \
            printf '%s\n' '0006-vessel-direct-transport-no-fallback.patch' >> debian/patches/series
          # Store the delta as a real Debian quilt patch, then return the source
          # tree to pristine state before gbp builds it.
          quilt pop -a
          rm -rf .pc
          git add debian/patches/series debian/patches/0006-vessel-direct-transport-no-fallback.patch
          git commit -m "vessel: require direct Android display transport"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Build KWin packages
        shell: bash
        run: |
          set -euxo pipefail
          cd /work/kwin
          gbp buildpackage -uc -us -jauto --git-ignore-branch --git-no-pristine-tar

      - name: Package runtime debs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /work/bundle
          find /work -maxdepth 1 -type f -name '*.deb' \
            ! -name '*-dev_*' ! -name '*-dbgsym_*' -print0 \
            | xargs -0 -r -I{} cp '{}' /work/bundle/
          test "$(find /work/bundle -type f -name '*.deb' | wc -l)" -gt 0
          cd /work/bundle
          zip -9 /work/kwin_vessel-direct_6.3.6-96_arm64.zip ./*.deb
          sha256sum /work/kwin_vessel-direct_6.3.6-96_arm64.zip > /work/kwin_vessel-direct_6.3.6-96_arm64.zip.sha256
          cat /work/kwin_vessel-direct_6.3.6-96_arm64.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: vessel-kwin-direct-6.3.6-96-arm64
          path: |
            /work/kwin_vessel-direct_6.3.6-96_arm64.zip
            /work/kwin_vessel-direct_6.3.6-96_arm64.zip.sha256
          retention-days: 90

      - name: Publish rolling KWin asset
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG=vessel-kwin-direct-edge
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Vessel Direct KWin Edge" \
              --notes "Pinned Anland KWin with Vessel direct transport: no reconnect/fallback rendering mode."
          fi
          gh release upload "$TAG" \
            /work/kwin_vessel-direct_6.3.6-96_arm64.zip \
            /work/kwin_vessel-direct_6.3.6-96_arm64.zip.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"
