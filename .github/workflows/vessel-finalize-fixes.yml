name: Finalize Vessel fixes once

on:
  push:
    branches: [ fix/vessel-real-source-20260917 ]
    paths:
      - '.github/workflows/vessel-finalize-fixes.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix redundant full scanout copies and clean migration files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/vessel_native/vessel_ahb_bridge.cpp')
          s = path.read_text()

          old = '''struct ScanoutState {
              std::array<BufferSlot, FRAME_SLOTS> slots{};
              uint32_t x = 0;
              uint32_t y = 0;
              uint32_t width = 0;
              uint32_t height = 0;
              uint32_t next_slot = 0;
              uint32_t next_serial = 1;
          };
          '''
          new = '''struct ScanoutState {
              std::array<BufferSlot, FRAME_SLOTS> slots{};
              uint32_t resource_id = 0;
              uint32_t x = 0;
              uint32_t y = 0;
              uint32_t width = 0;
              uint32_t height = 0;
              uint32_t next_slot = 0;
              uint32_t next_serial = 1;
          };
          '''
          if old not in s:
              raise SystemExit('ScanoutState anchor missing')
          s = s.replace(old, new, 1)

          old = '''    auto& state = g_scanouts[scanout_id];
              if (state.width != width || state.height != height) {
                  if (!wait_scanout_idle(state)) return RC_SOCKET;
                  destroy_scanout(state);
                  state.width = width;
                  state.height = height;
                  state.x = x;
                  state.y = y;
                  logi("scanout resized to stable frame " + std::to_string(width) + "x" + std::to_string(height));
              } else {
                  state.x = x;
                  state.y = y;
              }
          '''
          new = '''    auto& state = g_scanouts[scanout_id];
              const bool geometry_changed = state.width != width || state.height != height || state.x != x || state.y != y;
              const bool resource_changed = state.resource_id != 0 && state.resource_id != resource_id;
              if (geometry_changed || resource_changed) {
                  if (!wait_scanout_idle(state)) return RC_SOCKET;
                  destroy_scanout(state);
                  state.resource_id = resource_id;
                  state.width = width;
                  state.height = height;
                  state.x = x;
                  state.y = y;
                  logi(std::string(resource_changed ? "scanout resource changed; full refresh " : "scanout geometry changed; full refresh ") +
                       std::to_string(width) + "x" + std::to_string(height));
              } else {
                  state.resource_id = resource_id;
                  state.x = x;
                  state.y = y;
              }
          '''
          if old not in s:
              raise SystemExit('submit_resource geometry anchor missing')
          s = s.replace(old, new, 1)

          old = '''extern "C" int vessel_ahb_set_scanout(uint32_t resource_id, uint32_t scanout_id, uint32_t x, uint32_t y, uint32_t width, uint32_t height) {
              std::lock_guard<std::mutex> guard(g_lock);
              if (scanout_id >= MAX_SCANOUTS || !width || !height) return EINVAL;
              const DamageRect full = full_damage(width, height);
              const int rc = submit_resource(resource_id, scanout_id, x, y, width, height, full);
              if (rc) loge("SET_SCANOUT failed resource=" + std::to_string(resource_id) + " rc=" + std::to_string(rc));
              return rc;
          }
          '''
          new = '''extern "C" int vessel_ahb_set_scanout(uint32_t resource_id, uint32_t scanout_id, uint32_t x, uint32_t y, uint32_t width, uint32_t height) {
              std::lock_guard<std::mutex> guard(g_lock);
              if (scanout_id >= MAX_SCANOUTS || !width || !height) return EINVAL;
              auto& state = g_scanouts[scanout_id];
              if (state.resource_id == resource_id && state.x == x && state.y == y &&
                  state.width == width && state.height == height) {
                  // KWin/virtio-gpu may repeat SET_SCANOUT without changing the
                  // scanout. Re-copying the entire frame here destroys damage
                  // tracking and was the reason runtime logs showed only
                  // fullCopies. FLUSH_RESOURCE owns content updates after the
                  // first scanout bind.
                  return 0;
              }
              const DamageRect full = full_damage(width, height);
              const int rc = submit_resource(resource_id, scanout_id, x, y, width, height, full);
              if (rc) loge("SET_SCANOUT failed resource=" + std::to_string(resource_id) + " rc=" + std::to_string(rc));
              return rc;
          }
          '''
          if old not in s:
              raise SystemExit('set_scanout anchor missing')
          s = s.replace(old, new, 1)
          path.write_text(s)
          PY

          rm -f .github/workflows/vessel-integrate-source-v2.yml
          rm -f .github/workflows/vessel-finalize-fixes.yml

      - name: Commit final source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vessel-source-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf(vessel): preserve partial scanout damage'
          git push origin HEAD:fix/vessel-real-source-20260917
