name: Fix Vessel runtime regressions once

on:
  push:
    branches:
      - arch/vessel-self-contained
    paths:
      - '.github/workflows/vessel-fix-runtime-regressions-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/vessel-self-contained
          fetch-depth: 3

      - name: Recover and apply runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^^:.github/workflows/vessel-fix-runtime-regressions-once.yml > /tmp/vessel-old-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path('/tmp/vessel-old-workflow.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          body = lines[start + 1:end]
          body = [line[10:] if line.startswith('          ') else line for line in body]
          script = '\n'.join(body) + '\n'

          # The original one-shot YAML could not preserve indentation inside
          # this multiline C++ literal. Apply that edit with a tolerant regex
          # here, then remove the brittle replacement from the recovered script.
          bridge = Path('tools/vessel_native/vessel_ahb_bridge.cpp')
          source = bridge.read_text()
          pattern = re.compile(
              r'    const bool geometry_changed = state\.width != width \|\| state\.height != height \|\| state\.x != x \|\| state\.y != y;\n'
              r'    const bool resource_changed = state\.resource_id != 0 && state\.resource_id != resource_id;\n'
              r'    if \(geometry_changed \|\| resource_changed\) \{\n'
              r'.*?'
              r'    \} else \{\n'
              r'        state\.resource_id = resource_id;\n'
              r'        state\.x = x;\n'
              r'        state\.y = y;\n'
              r'    \}\n',
              re.S,
          )
          replacement = (
              '    const bool geometry_changed = state.width != width || state.height != height || state.x != x || state.y != y;\n'
              '    const bool resource_changed = state.resource_id != 0 && state.resource_id != resource_id;\n'
              '    if (geometry_changed) {\n'
              '        // Only a real scanout geometry change invalidates the Android output ring.\n'
              '        if (!wait_scanout_idle(state)) return RC_SOCKET;\n'
              '        destroy_scanout(state);\n'
              '        state.width = width;\n'
              '        state.height = height;\n'
              '        state.x = x;\n'
              '        state.y = y;\n'
              '        logi("scanout geometry changed; rebuilding AHB ring " + std::to_string(width) + "x" + std::to_string(height));\n'
              '    } else if (resource_changed) {\n'
              '        // SET_SCANOUT is a page flip. Keep the persistent AHB ring.\n'
              '        const DamageRect full = full_damage(state);\n'
              '        for (auto& slot : state.slots) {\n'
              '            if (slot.buffer && slot.content_valid) slot.pending_damage = full;\n'
              '        }\n'
              '    }\n'
              '    state.resource_id = resource_id;\n'
              '    state.x = x;\n'
              '    state.y = y;\n'
          )
          source2, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'bridge page-flip patch matched {count} blocks')
          bridge.write_text(source2)

          script2, removed = re.subn(
              r"rep\(bridge,\n\s+'''    const bool geometry_changed.*?\n'''\)\n",
              '',
              script,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit(f'could not remove brittle bridge replacement from recovered script: {removed}')
          Path('/tmp/vessel-runtime-fix.py').write_text(script2)
          PY
          python3 /tmp/vessel-runtime-fix.py
          git diff --check
          git status --short

      - name: Kotlin compile check
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --build-cache

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(vessel): smooth pageflips input apps and browser"
          git push origin HEAD:arch/vessel-self-contained
