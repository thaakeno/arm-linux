name: Fix Vessel runtime regressions once

on:
  push:
    branches:
      - arch/vessel-self-contained
    paths:
      - '.github/workflows/vessel-fix-runtime-regressions-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/vessel-self-contained
          fetch-depth: 5

      - name: Recover and apply runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          git show 3f8ff53fa23960d541c8f7c6974fa95a1d7e6b02:.github/workflows/vessel-fix-runtime-regressions-once.yml > /tmp/vessel-old-workflow.yml
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/vessel-old-workflow.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          raw = lines[start + 1:end]

          # The first workflow was invalid YAML because multiline Python string
          # contents were not given the YAML block's 10-space indentation. To
          # recover the intended Python exactly, strip the YAML prefix only from
          # Python-code lines; preserve lines while inside '''...''' literals.
          out = []
          in_triple = False
          for line in raw:
              if in_triple:
                  cooked = line
              else:
                  cooked = line[10:] if line.startswith('          ') else line
              out.append(cooked)
              if cooked.count("'''") % 2 == 1:
                  in_triple = not in_triple
          if in_triple:
              raise SystemExit('recovered patch script ended inside a triple-quoted string')
          Path('/tmp/vessel-runtime-fix.py').write_text('\n'.join(out) + '\n')
          PY
          python3 -m py_compile /tmp/vessel-runtime-fix.py
          python3 /tmp/vessel-runtime-fix.py
          git diff --check
          git status --short

      - name: Kotlin compile check
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --build-cache

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(vessel): smooth pageflips input apps and browser"
          git push origin HEAD:arch/vessel-self-contained
