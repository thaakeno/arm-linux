name: Integrate Vessel source once

on:
  push:
    branches: [ fix/vessel-real-source-20260917 ]
    paths:
      - 'tools/vessel_native/integrate_real_source.py'
      - '.github/workflows/vessel-integrate-source.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harden one-time integrator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/vessel_native/integrate_real_source.py')
          s = p.read_text()
          start = s.index("old_xy = '''")
          end_marker = "v = v.replace(old_xy, new_xy, 1)\n"
          end = s.index(end_marker, start) + len(end_marker)
          q = "'''"
          old_value = "            val x = ox + (VesselWaylandPresenter.cursorX() - VesselWaylandPresenter.cursorHotX()) * scale\\n            val rawY = VesselWaylandPresenter.cursorY()\\n            val guestY = if (VesselExperimentConfig.invertPointerY(context)) gh - rawY else rawY\\n            val y = oy + (guestY - VesselWaylandPresenter.cursorHotY()) * scale\\n"
          new_value = "            val predictionActive = SystemClock.uptimeMillis() <= cursorPredictionUntil && predictedCursorX.isFinite() && predictedCursorY.isFinite()\\n            val cursorX = if (predictionActive) predictedCursorX else VesselWaylandPresenter.cursorX().toFloat()\\n            val rawY = if (predictionActive) predictedCursorY else VesselWaylandPresenter.cursorY().toFloat()\\n            val guestY = if (VesselExperimentConfig.invertPointerY(context)) gh.toFloat() - rawY else rawY\\n            val x = ox + (cursorX - VesselWaylandPresenter.cursorHotX()) * scale\\n            val y = oy + (guestY - VesselWaylandPresenter.cursorHotY()) * scale\\n"
          replacement = "\n".join([
              "old_xy = " + q + old_value + q,
              "new_xy = " + q + new_value + q,
              "if old_xy not in v:",
              "    raise SystemExit('LinuxDesktopView alpha4 cursor draw anchor missing')",
              "v = v.replace(old_xy, new_xy, 1)",
              "",
          ])
          s = s[:start] + replacement + s[end:]
          s = s.replace(
              "predictedCursorY = (predictedCursorY + (dy * 1.25f) / scale).coerceIn(0f, gh.toFloat())",
              "predictedCursorY = (predictedCursorY + (dy * 1.25f * if (VesselExperimentConfig.invertPointerY(context)) -1f else 1f) / scale).coerceIn(0f, gh.toFloat())",
              1,
          )
          s = s.replace(
              "    raise SystemExit('desktop tuning anchor missing')",
              "    print('[integrate] desktop tuning anchor absent; existing desktop tuning kept')",
              1,
          )
          p.write_text(s)
          PY

      - name: Materialize runtime and apply fixes
        run: python3 tools/vessel_native/integrate_real_source.py

      - name: Commit authoritative source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vessel-source-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'refactor(vessel): integrate runtime source and fix desktop stack'
          git push origin HEAD:fix/vessel-real-source-20260917
