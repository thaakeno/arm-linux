name: Vessel direct storage integration

on:
  push:
    branches:
      - fix/storage-direct-20260917

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[storage-integrated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/storage-direct-20260917
          fetch-depth: 0

      - name: Integrate private rootfs directly into canonical source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing direct-integration anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          controller = "app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt"
          replace(controller,
              'const val REVISION = "v58-smooth-pageflip-input-browser-r1"',
              'const val REVISION = "v60-private-rootfs-fast-storage-r1"')
          replace(controller,
              'private const val MIN_DISK_CAPACITY_BYTES = 6L * 1024L * 1024L * 1024L',
              'private const val MIN_DISK_CAPACITY_BYTES = 10L * 1024L * 1024L * 1024L')
          replace(controller,
              'private const val MIN_GUEST_FREE_KIB = 2_000_000L',
              'private const val MIN_GUEST_FREE_KIB = 512_000L\n        private const val PREFERRED_GUEST_FREE_KIB = 2_000_000L')
          replace(controller,
          '''    val machineDir: File = File(
                  Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS),
                  "LinuxPC/Vessel-Debian",
              )
              private val disk = File(machineDir, "debian-docker.ext4")
              private val persistentLog = File(machineDir, "vessel-runtime.log")
          ''',
          '''    private val legacyMachineDir: File = File(
                  Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS),
                  "LinuxPC/Vessel-Debian",
              )
              // The live ext4 image belongs on Android's real private filesystem.
              // /storage/emulated/0 is an emulated/FUSE-style path and is far slower
              // for the random 4 KiB I/O generated by a desktop Linux filesystem.
              val machineDir: File = File(context.filesDir, "vessel-machine").apply { mkdirs() }
              private val disk = File(machineDir, "debian-docker.ext4")
              private val persistentLog = File(machineDir, "vessel-runtime.log")
          ''')
          replace(controller,
              'fun hasStorageAccess(): Boolean = Environment.isExternalStorageManager()',
              'fun hasStorageAccess(): Boolean = machineDir.isDirectory || machineDir.mkdirs()')
          replace(controller,
          '''    private fun ensureDisk() {
                  check(hasStorageAccess()) { "Storage access required for Download/LinuxPC" }
                  check(machineDir.exists() || machineDir.mkdirs()) { "Cannot create ${machineDir.absolutePath}" }
          ''',
          '''    private fun migrateLegacyDiskIfNeeded() {
                  if (disk.isFile && disk.length() > 512L * 1024 * 1024) return
                  val legacyDisk = File(legacyMachineDir, "debian-docker.ext4")
                  if (!legacyDisk.isFile || legacyDisk.length() <= 512L * 1024 * 1024 || !legacyDisk.canRead()) return

                  val tmp = File(machineDir, "debian-docker.ext4.migrating")
                  tmp.delete()
                  val total = legacyDisk.length().coerceAtLeast(1L)
                  progress("disk_migrate", 5, "Moving Linux disk to fast private storage once")
                  val buffer = ByteArray(1024 * 1024)
                  try {
                      RandomAccessFile(legacyDisk, "r").use { src ->
                          RandomAccessFile(tmp, "rw").use { dst ->
                              dst.setLength(0L)
                              var done = 0L
                              while (true) {
                                  val n = src.read(buffer)
                                  if (n < 0) break
                                  var nonZero = false
                                  var i = 0
                                  while (i < n) {
                                      if (buffer[i].toInt() != 0) {
                                          nonZero = true
                                          break
                                      }
                                      i++
                                  }
                                  if (nonZero) dst.write(buffer, 0, n) else dst.seek(dst.filePointer + n)
                                  done += n
                                  if (done % (64L * 1024 * 1024) < buffer.size) {
                                      val pct = (5 + (done * 18L / total).toInt()).coerceIn(5, 23)
                                      progress("disk_migrate", pct, "Migrating Linux disk to fast private storage")
                                  }
                              }
                              dst.setLength(src.length())
                          }
                      }
                      if (disk.exists()) check(disk.delete()) { "Cannot replace incomplete private Debian disk" }
                      check(tmp.renameTo(disk)) { "Could not finish private Debian disk migration" }
                      append("[storage] sparse-migrated legacy rootfs to ${disk.absolutePath}; legacy copy retained for safety\\n")
                  } catch (t: Throwable) {
                      tmp.delete()
                      throw IllegalStateException("Could not migrate the existing Debian disk to fast private storage", t)
                  }
              }

              private fun ensureDisk() {
                  check(machineDir.exists() || machineDir.mkdirs()) { "Cannot create ${machineDir.absolutePath}" }
                  migrateLegacyDiskIfNeeded()
          ''')
          replace(controller,
              'progress("disk_download", 4, "Downloading Debian once to Download/LinuxPC")',
              'progress("disk_download", 4, "Downloading Debian once to fast private storage")')
          replace(controller,
          '''        check(freeRc == 0) {
                      "Debian filesystem still has too little free space after resize (${freeOut.trim()}); Vessel requires at least ${MIN_GUEST_FREE_KIB} KiB free"
                  }
                  append("[disk] ${freeOut.trim()} after ext4 resize\\n")
          ''',
          '''        check(freeRc == 0) {
                      "Debian filesystem is critically low on free space after resize (${freeOut.trim()}); Vessel requires at least ${MIN_GUEST_FREE_KIB} KiB free"
                  }
                  val freeKib = Regex("""free_kib=(\\d+)""").find(freeOut)?.groupValues?.getOrNull(1)?.toLongOrNull()
                  if (freeKib != null && freeKib < PREFERRED_GUEST_FREE_KIB) {
                      append("[disk] warning: ${freeOut.trim()} after ext4 resize; below preferred ${PREFERRED_GUEST_FREE_KIB} KiB but safe to boot\\n")
                  } else {
                      append("[disk] ${freeOut.trim()} after ext4 resize\\n")
                  }
          ''')

          activity = "app/src/main/java/com/example/dreamlinux/VesselActivity.kt"
          replace(activity,
          '''    private fun startLinux() {
                  if (!Environment.isExternalStorageManager()) {
                      startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  VmSessionService.active?.refreshAvailability()
                  VmSessionService.active?.startVm()
              }
          ''',
          '''    private fun startLinux() {
                  VmSessionService.active?.refreshAvailability()
                  VmSessionService.active?.startVm()
              }
          ''')

          service = "app/src/main/java/com/example/dreamlinux/VmSessionService.kt"
          replace(service,
              'val runtimeRevision: String = "v59-private-rootfs-fast-ui-r1"',
              'val runtimeRevision: String = "v60-private-rootfs-fast-storage-r1"')

          gradle = "app/build.gradle.kts"
          replace(gradle,
              'versionName = "2.1.0-alpha14"',
              'versionName = "2.1.0-alpha15"')
          PY

          grep -F 'val machineDir: File = File(context.filesDir, "vessel-machine")' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'MIN_DISK_CAPACITY_BYTES = 10L * 1024L * 1024L * 1024L' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'MIN_GUEST_FREE_KIB = 512_000L' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'migrateLegacyDiskIfNeeded()' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          ! grep -Fq 'Storage access required for Download/LinuxPC' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          ! grep -Fq 'ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION' app/src/main/java/com/example/dreamlinux/VesselActivity.kt

      - name: Commit canonical source only
        shell: bash
        run: |
          git config user.name "thaakeno"
          git config user.email "thaakeno46@gmail.com"
          git rm .github/workflows/vessel-storage-direct-once.yml
          git add app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt \
                  app/src/main/java/com/example/dreamlinux/VesselActivity.kt \
                  app/src/main/java/com/example/dreamlinux/VmSessionService.kt \
                  app/build.gradle.kts
          git commit -m "fix(vessel): move rootfs to private storage [storage-integrated]"
          git push origin HEAD:fix/storage-direct-20260917
