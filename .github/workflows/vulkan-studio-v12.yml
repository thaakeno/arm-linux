name: Vulkan Studio v12

on:
  push:
    branches: [ app/vessel-final ]
  workflow_dispatch:

concurrency:
  group: vulkan-studio-v12-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Install SDK/NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"
      - name: Fetch renderer assets
        run: |
          set -euxo pipefail
          A=app/src/main/assets/vulkan_v7
          T=app/src/main/cpp/third_party
          mkdir -p "$A" "$T"
          UA='Vessel-Vulkan-Studio-v12.0/1.0'
          get(){ curl --fail --location --retry 4 --retry-delay 2 --user-agent "$UA" "$1" --output "$2"; test -s "$2"; }
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/cobblestone_pavement/cobblestone_pavement_diff_2k.jpg' "$A/cobblestone_diff_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/cobblestone_pavement/cobblestone_pavement_nor_gl_2k.jpg' "$A/cobblestone_nor_gl_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/cobblestone_pavement/cobblestone_pavement_arm_2k.jpg' "$A/cobblestone_arm_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/png/2k/cobblestone_pavement/cobblestone_pavement_disp_2k.png' "$A/cobblestone_disp_2k.png"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rough_concrete/rough_concrete_diff_2k.jpg' "$A/rough_concrete_diff_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rough_concrete/rough_concrete_nor_gl_2k.jpg' "$A/rough_concrete_nor_gl_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rough_concrete/rough_concrete_arm_2k.jpg' "$A/rough_concrete_arm_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/png/2k/rough_concrete/rough_concrete_disp_2k.png' "$A/rough_concrete_disp_2k.png"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/dark_rock/dark_rock_diff_2k.jpg' "$A/dark_rock_diff_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/dark_rock/dark_rock_nor_gl_2k.jpg' "$A/dark_rock_nor_gl_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/dark_rock/dark_rock_arm_2k.jpg' "$A/dark_rock_arm_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/png/2k/dark_rock/dark_rock_disp_2k.png' "$A/dark_rock_disp_2k.png"
          get 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/alps_field_1k.hdr' "$A/evening_museum_courtyard_1k.hdr"
          get 'https://opengameart.org/sites/default/files/fire1_64.png' "$A/fire1_64.png"
          get 'https://raw.githubusercontent.com/nothings/stb/master/stb_image.h' "$T/stb_image.h"
      - name: Apply v11 compatibility then v12 overhaul
        run: |
          set -euxo pipefail
          python3 -m py_compile tools/venus_poc/apply_v11_showcase.py tools/venus_poc/apply_v12_showcase.py
          python3 tools/venus_poc/apply_v11_showcase.py
          python3 tools/venus_poc/apply_v12_showcase.py
      - name: Validate v12 markers
        run: |
          set -euxo pipefail
          grep -F 'VULKAN STUDIO  //  v12.0' app/src/main/java/com/example/dreamlinux/NativeCubeActivity.kt
          grep -F 'nativeSetBodyProperty' app/src/main/java/com/example/dreamlinux/NativeCubeActivity.kt
          grep -F 'Studio v12.0' app/src/main/cpp/native_vulkan_studio_v7_part1.inc
          grep -F 'Unreal-style playground platforms' app/src/main/cpp/native_vulkan_studio_v7_part4.inc
          grep -F 'Vulkan Studio v12.0' app/src/main/cpp/shaders/native_studio_v7_rt.frag
          grep -F 'const int LEAVES=0' app/src/main/cpp/shaders/native_studio_v7.vert
      - name: Build APK
        run: bash ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --no-configuration-cache
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vessel-v12-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
