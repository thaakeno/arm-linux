name: Vessel UML SMP Kernel

# Rebuild trigger for Vessel's custom UML/arm64 kernel.
on:
  push:
    branches: [ app/vessel-final, arch/vessel-wlroots-final ]
    paths:
      - 'tools/venus_poc/build_uml_smp_android.sh'
      - 'tools/venus_poc/apply_umshm.py'
      - 'tools/venus_poc/fix_umshm_nonblock.py'
      - 'tools/venus_poc/fix_umshm_ptrace_fds.py'
      - 'tools/venus_poc/patch_virtio_uml_vhost_gpu.py'
      - 'tools/venus_poc/run_venus_uml.sh'
      - '.github/workflows/build-uml-smp.yml'
  workflow_dispatch:

concurrency:
  group: vessel-uml-smp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Vessel
        uses: actions/checkout@v4

      # ubuntu-latest already ships the Android command-line tools.  Do not use
      # android-actions/setup-android here: as of Sep 2026 its default package
      # list still asks sdkmanager for the removed legacy `tools` package and
      # aborts before our kernel build even starts.
      - name: Install NDK and kernel build dependencies
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'ndk;27.2.12479018'
          sudo apt-get update
          sudo apt-get install -y \
            clang build-essential flex bison bc rsync cpio pkg-config \
            libssl-dev libelf-dev dwarves python3 git file zip

      - name: Build SMP UML/arm64 with Vessel umshm and virtio-gpu
        env:
          NDK: /usr/local/lib/android/sdk/ndk/27.2.12479018
          JOBS: '4'
        run: |
          set -euxo pipefail
          bash tools/venus_poc/build_uml_smp_android.sh

      - name: Verify kernel configuration and command line
        run: |
          set -euxo pipefail
          ART=.kernel-build/artifacts
          grep -qx 'CONFIG_SMP=y' "$ART/vessel-uml-smp.config"
          grep -qx 'CONFIG_NR_CPUS=8' "$ART/vessel-uml-smp.config"
          grep -qx 'CONFIG_UML_DMA_EMULATION=y' "$ART/vessel-uml-smp.config"
          grep -qx 'CONFIG_VIRTIO=y' "$ART/vessel-uml-smp.config"
          grep -qx 'CONFIG_VIRTIO_UML=y' "$ART/vessel-uml-smp.config"
          grep -qx 'CONFIG_DRM=y' "$ART/vessel-uml-smp.config"
          grep -qx 'CONFIG_DRM_VIRTIO_GPU=y' "$ART/vessel-uml-smp.config"
          grep -qx 'CONFIG_DRM_VIRTIO_GPU_KMS=y' "$ART/vessel-uml-smp.config"
          strings "$ART/linux-umshm" | grep -F 'ncpus=<# of desired CPUs>'
          strings "$ART/linux-umshm" | grep -F 'Vessel vhost-user-gpu display relay attached'
          grep -F 'VHOST_USER_GPU_SET_SOCKET=33' "$ART/SHA256SUMS.txt"
          file "$ART/linux-umshm" | grep -Ei 'aarch64|ARM aarch64'
          test -s "$ART/stub_exe-umshm"
          cat "$ART/SHA256SUMS.txt"

      - name: Upload SMP + virtio-gpu kernel
        uses: actions/upload-artifact@v4
        with:
          name: vessel-uml-smp-arm64
          path: |
            .kernel-build/artifacts/linux-umshm
            .kernel-build/artifacts/stub_exe-umshm
            .kernel-build/artifacts/vessel-uml-smp.config
            .kernel-build/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish rolling Termux-installable kernel
        if: github.ref == 'refs/heads/arch/vessel-wlroots-final'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ART=.kernel-build/artifacts
          ZIP="$GITHUB_WORKSPACE/vessel-uml-smp-arm64.zip"
          rm -f "$ZIP"
          (
            cd "$ART"
            zip -9 "$ZIP" linux-umshm stub_exe-umshm vessel-uml-smp.config SHA256SUMS.txt
          )
          TAG='vessel-virtio-gpu-kernel-latest'
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title 'Vessel Virtio GPU Kernel (rolling)' \
            --notes "Rootless ARM64 UML kernel for Vessel virtio-gpu. Branch: $GITHUB_REF_NAME. Commit: $GITHUB_SHA. Includes VIRTIO_UML, DRM_VIRTIO_GPU and the VHOST_USER_GPU_SET_SOCKET side-channel handoff." \
            --prerelease \
            "$ZIP#vessel-uml-smp-arm64.zip"
          gh release view "$TAG" --json tagName,assets,url
