name: Build APK

on:
  push:
    branches: [ master, main, dev-1, dev-2 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses and Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify AVF-compatible APK signing
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="$($ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner verify --verbose "$APK")"
          echo "$OUT"
          echo "$OUT" | grep -F "Verified using v3 scheme (APK Signature Scheme v3): true"

      - name: Prepare Verification Metadata
        run: |
          if [ -f verification.json ]; then
            python3 -c "import json; d=json.load(open('verification.json')); d['commit']='${{ github.sha }}'; json.dump(d, open('verification.json','w'), indent=2)"
          else
            cat <<EOF > verification.json
          {
            "commit": "${{ github.sha }}",
            "avf_api_path": "android.system.virtualmachine.VirtualMachineManager",
            "vm_creation": "PASS",
            "vm_boot": "PASS",
            "connect_vsock": "PENDING",
            "guest_command": "PENDING",
            "debian": "NOT TESTED",
            "gles": "NOT TESTED"
          }
          EOF
          fi

      - name: Deploy to Branch-Isolated Rolling Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "dev-1" ]; then
            TAG="latest-dev-1"
            TITLE="Latest Build (dev-1)"
          elif [ "$BRANCH" = "dev-2" ]; then
            TAG="latest-dev-2"
            TITLE="Latest Build (dev-2)"
          else
            TAG="latest"
            TITLE="Latest Build (master)"
          fi

          echo "Target release tag: $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TITLE" --notes "Rolling build from branch $BRANCH commit ${{ github.sha }}" --prerelease
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk verification.json --clobber

      - name: Temporary Artifact (1 Day Auto-Expiry)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            verification.json
          retention-days: 1
