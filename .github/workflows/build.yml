name: Build APK

on:
  push:
    branches: [ master, main, dev-1, dev-2 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses and Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"

      - name: Prepare compressed Debian 13 ext4 seed
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y debootstrap e2fsprogs g++-aarch64-linux-gnu
          rm -rf build/debian-rootfs
          mkdir -p app/src/main/assets build/debian-rootfs
          rm -f app/src/main/assets/debian-rootfs.ext4 app/src/main/assets/debian-rootfs.ext4.gz \
                app/src/main/assets/debian-rootfs.ext4.size app/src/main/assets/debian-rootfs.ext4.sha256

          sudo debootstrap --arch=arm64 --foreign --variant=minbase trixie build/debian-rootfs http://deb.debian.org/debian
          sudo find build/debian-rootfs/dev build/debian-rootfs/proc build/debian-rootfs/sys build/debian-rootfs/run -mindepth 1 -delete 2>/dev/null || true

          sudo mkdir -p build/debian-rootfs/usr/local/bin
          aarch64-linux-gnu-g++ tools/dev1_guest_bridge.cpp -std=c++20 -O2 -fPIE -pie -pthread -s -o /tmp/dev1_guest_bridge
          sudo install -m 0755 /tmp/dev1_guest_bridge build/debian-rootfs/usr/local/bin/dev1_guest_bridge

          printf '%s\n' 'Debian GNU/Linux 13 (trixie) arm64 minbase · compressed ext4 seed · expands persistently in pVM' > app/src/main/assets/debian-version.txt

          # Seed only needs to hold minbase. On first successful guest mount we grow the
          # persistent backing file sparsely to 8 GiB and resize ext4 online.
          truncate -s 768M /tmp/debian-rootfs.ext4
          sudo mkfs.ext4 -F -L DEV1_DEBIAN -m 0 -d build/debian-rootfs /tmp/debian-rootfs.ext4
          sudo e2fsck -fy /tmp/debian-rootfs.ext4
          sudo chown "$USER:$USER" /tmp/debian-rootfs.ext4

          debugfs -R 'stat /etc/debian_version' /tmp/debian-rootfs.ext4
          debugfs -R 'stat /debootstrap/debootstrap' /tmp/debian-rootfs.ext4
          debugfs -R 'stat /usr/local/bin/dev1_guest_bridge' /tmp/debian-rootfs.ext4
          file /tmp/dev1_guest_bridge

          stat -c '%s' /tmp/debian-rootfs.ext4 > app/src/main/assets/debian-rootfs.ext4.size
          sha256sum /tmp/debian-rootfs.ext4 | awk '{print $1}' > app/src/main/assets/debian-rootfs.ext4.sha256
          gzip -1 -n -c /tmp/debian-rootfs.ext4 > app/src/main/assets/debian-rootfs.ext4.gz
          ls -lh /tmp/debian-rootfs.ext4 app/src/main/assets/debian-rootfs.ext4.gz

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore persistent development signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            chmod 600 "$HOME/.android/debug.keystore"
            echo "STABLE_SIGNING=false" >> "$GITHUB_ENV"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build and check APK
        run: ./gradlew stageDebugApk testDebugUnitTest lintDebug --no-daemon --no-configuration-cache

      - name: Verify compressed ext4 seed inside APK
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import gzip, hashlib, os, shutil, subprocess, tempfile, zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          asset='assets/debian-rootfs.ext4.gz'
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              for required in [asset, 'assets/debian-rootfs.ext4.size', 'assets/debian-rootfs.ext4.sha256']:
                  assert required in names, required
              info=z.getinfo(asset)
              assert info.file_size < 500_000_000, info.file_size
              expected_size=int(z.read('assets/debian-rootfs.ext4.size').decode().strip())
              expected_sha=z.read('assets/debian-rootfs.ext4.sha256').decode().strip()
              with tempfile.NamedTemporaryFile(delete=False) as f:
                  p=f.name
                  with z.open(asset) as raw, gzip.GzipFile(fileobj=raw) as gz:
                      shutil.copyfileobj(gz, f, 1024*1024)
          try:
              assert os.path.getsize(p) == expected_size
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
              assert h.hexdigest() == expected_sha
              subprocess.check_call(['e2fsck','-fn',p])
              for path in ['/etc/debian_version','/debootstrap/debootstrap','/usr/local/bin/dev1_guest_bridge']:
                  out=subprocess.check_output(['debugfs','-R',f'stat {path}',p], stderr=subprocess.STDOUT, text=True)
                  assert 'Inode:' in out, path
          finally:
              os.unlink(p)
          print('APK compressed ext4 Debian seed verification: PASS')
          PY

      - name: Verify APK Signature Schemes
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' apk-signature.txt

      - name: Prepare Verification Metadata
        run: |
          cat <<EOF > verification.json
          {
            "commit": "${{ github.sha }}",
            "version": "0.8.6-dev1",
            "apk_signature_v3": "PASS",
            "debian_bundle": "DEBIAN 13 ARM64 MINBASE IN GZIP-COMPRESSED 768 MIB EXT4 SEED",
            "first_boot": "TOYBOX GZIP STREAMS SMALL APK ASSET DIRECTLY INTO ENCRYPTED STORAGE WITH PROGRESS + SIZE + SHA256 CHECKS",
            "persistent_root": "SEED LOOP-MOUNTED EXEC THEN BACKING FILE SPARSE-GROWN TO 8 GIB AND EXT4 RESIZED ONLINE",
            "execution": "NOEXEC ENCRYPTEDSTORE IS BACKING ONLY; DEBIAN EXECUTES FROM LOOP-MOUNTED EXT4",
            "network_bridge": "DEBIAN GLIBC ARM64 BRIDGE RUNS FROM EXEC ROOT; HOST INTERNET OVER VSOCK",
            "protected_vm_identity": "UNIQUE PER APK VERSION CODE",
            "runtime": "TARGET PHONE RETEST REQUIRED",
            "hardware_acceleration": "NOT PROVEN"
          }
          EOF

      - name: Deploy to Branch-Isolated Rolling Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "dev-1" ]; then TAG="latest-dev-1"; TITLE="Latest Build (dev-1)";
          elif [ "$BRANCH" = "dev-2" ]; then TAG="latest-dev-2"; TITLE="Latest Build (dev-2)";
          else TAG="latest"; TITLE="Latest Build (master)"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TITLE" --notes "Rolling build from branch $BRANCH commit ${{ github.sha }}" --prerelease
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk verification.json apk-signature.txt --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name | select(startswith("DreamLinux-") and endswith(".apk"))' | while IFS= read -r asset; do gh release delete-asset "$TAG" "$asset" --yes; done
          gh release upload "$TAG" build/deliverables/DreamLinux-*.apk --clobber
          gh release edit "$TAG" --notes "Branch $BRANCH; commit ${{ github.sha }}; version 0.8.6-dev1. First boot no longer copies a 1.8 GiB APK entry. A small gzip-compressed ext4 seed is streamed into persistent encrypted storage, verified, loop-mounted exec, then sparsely expanded to 8 GiB. Runtime verification requires the target phone."

      - name: Temporary Artifact (1 Day Auto-Expiry)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            verification.json
            apk-signature.txt
            build/deliverables/DreamLinux-*.apk
          retention-days: 1
