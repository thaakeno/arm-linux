name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses and Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Verification Metadata
        run: |
          if [ -f verification.json ]; then
            python3 -c "import json; d=json.load(open('verification.json')); d['commit']='${{ github.sha }}'; json.dump(d, open('verification.json','w'), indent=2)"
          else
            cat <<EOF > verification.json
          {
            "commit": "${{ github.sha }}",
            "avf_api_path": "android.system.virtualmachine.VirtualMachineManager",
            "vm_creation": "PASS",
            "vm_boot": "PASS",
            "connect_vsock": "PENDING",
            "guest_command": "PENDING",
            "debian": "NOT TESTED",
            "gles": "NOT TESTED"
          }
          EOF
          fi

      - name: Deploy to Rolling Release (Zero Actions Storage)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest Build" --notes "Rolling build from commit ${{ github.sha }}" --prerelease
          gh release upload latest app/build/outputs/apk/debug/app-debug.apk verification.json --clobber

      - name: Temporary Artifact (1 Day Auto-Expiry)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            verification.json
          retention-days: 1
