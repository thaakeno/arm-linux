name: Build APK

on:
  push:
    branches: [ master, main, dev-1, dev-2 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses and Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"

      - name: Prepare Alpine pVM payload assets
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets
          python3 - <<'PY'
          import re, urllib.request
          base = 'https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64/'
          html = urllib.request.urlopen(base, timeout=30).read().decode('utf-8', 'replace')
          names = re.findall(r'href="(alpine-minirootfs-[0-9][^"/]*-aarch64\.tar\.gz)"', html)
          names = [n for n in names if '_rc' not in n and '-rc' not in n]
          if not names:
              raise SystemExit('No Alpine aarch64 minirootfs found in latest-stable index')
          def version_key(name):
              m = re.search(r'alpine-minirootfs-([0-9]+(?:\.[0-9]+)+)-aarch64', name)
              return tuple(int(x) for x in m.group(1).split('.')) if m else (0,)
          name = max(names, key=version_key)
          print('Bundling', name)
          urllib.request.urlretrieve(base + name, 'app/src/main/assets/alpine-minirootfs.tar.gz')
          open('app/src/main/assets/alpine-version.txt', 'w').write(name + '\n')
          PY
          CXX="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          "$CXX" tools/dev1_guest_bridge.cpp -std=c++20 -O2 -fPIE -pie -pthread -Wl,--strip-all -o app/src/main/assets/dev1_guest_bridge
          file app/src/main/assets/dev1_guest_bridge
          ls -lh app/src/main/assets

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore persistent development signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
            chmod 600 "$HOME/.android/debug.keystore"
            echo "STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Persistent signing key missing; generated an ephemeral Android debug key for this rolling test build. Android may require uninstalling an older differently-signed APK before installation. Files in /data/local/tmp/dev1-linux* are retained."
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "Debug keystore ready for Gradle and post-build re-signing"

      - name: Build and check APK
        run: ./gradlew stageDebugApk testDebugUnitTest lintDebug --no-daemon

      - name: Normalize Alpine asset and re-sign APK
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TMP="app/build/outputs/apk/debug/app-repacked.apk"
          ALIGNED="app/build/outputs/apk/debug/app-aligned.apk"

          python3 - <<'PY'
          import gzip, zipfile
          src='app/build/outputs/apk/debug/app-debug.apk'
          dst='app/build/outputs/apk/debug/app-repacked.apk'
          with zipfile.ZipFile(src, 'r') as zin:
              names=set(zin.namelist())
              root_name='assets/alpine-minirootfs.tar' if 'assets/alpine-minirootfs.tar' in names else 'assets/alpine-minirootfs.tar.gz'
              raw=zin.read(root_name)
              gz=raw if root_name.endswith('.gz') else gzip.compress(raw, compresslevel=9, mtime=0)
              helper=zin.read('assets/dev1_guest_bridge')
              version=zin.read('assets/alpine-version.txt')
              if not helper.startswith(b'\x7fELF'):
                  raise SystemExit('dev1_guest_bridge is not an ELF executable')
              with zipfile.ZipFile(dst, 'w', allowZip64=True) as zout:
                  for info in zin.infolist():
                      name=info.filename
                      if name in {'assets/alpine-minirootfs.tar','assets/alpine-minirootfs.tar.gz'}:
                          continue
                      upper=name.upper()
                      if upper.startswith('META-INF/') and upper.endswith(('.SF','.RSA','.DSA','.EC')):
                          continue
                      if upper == 'META-INF/MANIFEST.MF':
                          continue
                      zout.writestr(info, zin.read(name))
                  info=zipfile.ZipInfo('assets/alpine-minirootfs.tar.gz')
                  info.compress_type=zipfile.ZIP_STORED
                  info.external_attr=0o100644 << 16
                  zout.writestr(info, gz)
          print('repacked Alpine rootfs gzip bytes', len(gz), 'version', version.decode().strip())
          PY

          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 "$TMP" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$ALIGNED"
          mv "$ALIGNED" "$APK"
          rm -f "$TMP" "$APK.idsig"

          for f in build/deliverables/DreamLinux-*.apk; do
            cp "$APK" "$f"
          done

          unzip -l "$APK" | grep -F 'assets/alpine-minirootfs.tar.gz'
          unzip -l "$APK" | grep -F 'assets/dev1_guest_bridge'
          python3 - <<'PY'
          import gzip, io, tarfile, zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              data=z.read('assets/alpine-minirootfs.tar.gz')
              raw=gzip.decompress(data)
              with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as t:
                  names=t.getnames()
                  assert any(n.endswith('etc/alpine-release') or n == 'etc/alpine-release' for n in names)
              assert z.read('assets/dev1_guest_bridge').startswith(b'\x7fELF')
          print('APK Alpine bundle verification: PASS')
          PY

      - name: Verify APK Signature Schemes
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' apk-signature.txt
          echo 'AVF-required APK Signature Scheme v3: PASS'

      - name: Prepare Verification Metadata
        run: |
          cat <<EOF > verification.json
          {
            "commit": "${{ github.sha }}",
            "version": "0.7.1-dev1",
            "apk_signature_v3": "PASS",
            "stable_signing": "${{ env.STABLE_SIGNING }}",
            "alpine_bundle": "APK ENTRY + GZIP + TAR + HELPER VERIFIED IN CI",
            "avf_api_path": "android.system.virtualmachine.VirtualMachineManager",
            "microdroid_gate_a": "PASS ON TARGET FROM PRIOR DEVICE TEST",
            "linux_userspace": "ALPINE ROOTFS IN MICRODROID ENCRYPTED STORE; TARGET RETEST REQUIRED",
            "network": "HOST-MEDIATED HTTP PROXY OVER VSOCK; TARGET RETEST REQUIRED",
            "desktop": "XFCE/TIGERVNC PROVISIONING; TARGET RETEST REQUIRED",
            "hardware_acceleration": "NOT PROVEN"
          }
          EOF

      - name: Deploy to Branch-Isolated Rolling Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "dev-1" ]; then
            TAG="latest-dev-1"
            TITLE="Latest Build (dev-1)"
          elif [ "$BRANCH" = "dev-2" ]; then
            TAG="latest-dev-2"
            TITLE="Latest Build (dev-2)"
          else
            TAG="latest"
            TITLE="Latest Build (master)"
          fi

          echo "Target release tag: $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TITLE" --notes "Rolling build from branch $BRANCH commit ${{ github.sha }}" --prerelease
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk verification.json apk-signature.txt --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name | select(startswith("DreamLinux-") and endswith(".apk"))' | while IFS= read -r asset; do
            gh release delete-asset "$TAG" "$asset" --yes
          done
          gh release upload "$TAG" build/deliverables/DreamLinux-*.apk --clobber
          gh release edit "$TAG" --notes "Branch $BRANCH; commit ${{ github.sha }}; version 0.7.1-dev1. Alpine gzip/rootfs/helper assets are verified inside the final signed APK. Runtime Internet/desktop/GPU verification still requires the target phone."

      - name: Temporary Artifact (1 Day Auto-Expiry)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            verification.json
            apk-signature.txt
            build/deliverables/DreamLinux-*.apk
          retention-days: 1
