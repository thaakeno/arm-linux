name: Build APK

on:
  push:
    branches: [ master, main, dev-1, dev-2 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses and Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"

      - name: Prepare Debian 13 executable ext4 userspace asset
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y debootstrap e2fsprogs g++-aarch64-linux-gnu
          rm -rf build/debian-rootfs
          mkdir -p app/src/main/assets build/debian-rootfs

          sudo debootstrap --arch=arm64 --foreign --variant=minbase trixie build/debian-rootfs http://deb.debian.org/debian
          sudo find build/debian-rootfs/dev build/debian-rootfs/proc build/debian-rootfs/sys build/debian-rootfs/run -mindepth 1 -delete 2>/dev/null || true

          # This helper is a normal Debian/glibc ARM64 executable. It is launched only after
          # the ext4 image is mounted exec by VM-local root, so Microdroid's noexec encryptedstore
          # and microdroid_app TCP restrictions no longer apply to it.
          sudo mkdir -p build/debian-rootfs/usr/local/bin
          aarch64-linux-gnu-g++ tools/dev1_guest_bridge.cpp -std=c++20 -O2 -fPIE -pie -pthread -s -o /tmp/dev1_guest_bridge
          sudo install -m 0755 /tmp/dev1_guest_bridge build/debian-rootfs/usr/local/bin/dev1_guest_bridge

          printf '%s\n' 'Debian GNU/Linux 13 (trixie) arm64 minbase · executable ext4 root' > app/src/main/assets/debian-version.txt

          # Build a self-contained filesystem instead of extracting a tar directly onto
          # /mnt/encryptedstore, which the target proves is mounted noexec.
          rm -f app/src/main/assets/debian-rootfs.ext4
          truncate -s 2560M app/src/main/assets/debian-rootfs.ext4
          sudo mkfs.ext4 -F -L DEV1_DEBIAN -m 0 -d build/debian-rootfs app/src/main/assets/debian-rootfs.ext4
          sudo e2fsck -fy app/src/main/assets/debian-rootfs.ext4
          sudo chown "$USER:$USER" app/src/main/assets/debian-rootfs.ext4

          debugfs -R 'stat /etc/debian_version' app/src/main/assets/debian-rootfs.ext4
          debugfs -R 'stat /debootstrap/debootstrap' app/src/main/assets/debian-rootfs.ext4
          debugfs -R 'stat /usr/local/bin/dev1_guest_bridge' app/src/main/assets/debian-rootfs.ext4
          file /tmp/dev1_guest_bridge
          ls -lh app/src/main/assets/debian-rootfs.ext4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore persistent development signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            chmod 600 "$HOME/.android/debug.keystore"
            echo "STABLE_SIGNING=false" >> "$GITHUB_ENV"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build and check APK
        run: ./gradlew stageDebugApk testDebugUnitTest lintDebug --no-daemon --no-configuration-cache

      - name: Normalize ext4 asset and re-sign APK
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TMP="app/build/outputs/apk/debug/app-repacked.apk"
          ALIGNED="app/build/outputs/apk/debug/app-aligned.apk"
          python3 - <<'PY'
          import zipfile
          src='app/build/outputs/apk/debug/app-debug.apk'
          dst='app/build/outputs/apk/debug/app-repacked.apk'
          asset='assets/debian-rootfs.ext4'
          with zipfile.ZipFile(src, 'r') as zin:
              if asset not in zin.namelist():
                  raise SystemExit('Debian ext4 asset missing from APK')
              with zipfile.ZipFile(dst, 'w', allowZip64=True, compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
                  for info in zin.infolist():
                      name=info.filename
                      upper=name.upper()
                      if upper.startswith('META-INF/') and upper.endswith(('.SF','.RSA','.DSA','.EC')):
                          continue
                      if upper == 'META-INF/MANIFEST.MF':
                          continue
                      data=zin.read(name)
                      out=zipfile.ZipInfo(name)
                      out.date_time=info.date_time
                      out.external_attr=info.external_attr
                      out.compress_type=zipfile.ZIP_DEFLATED if name == asset else info.compress_type
                      zout.writestr(out, data)
          PY
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 "$TMP" "$ALIGNED"
          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$ALIGNED"
          mv "$ALIGNED" "$APK"
          rm -f "$TMP" "$APK.idsig"
          for f in build/deliverables/DreamLinux-*.apk; do cp "$APK" "$f"; done
          python3 - <<'PY'
          import os, tempfile, zipfile, subprocess
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              info=z.getinfo('assets/debian-rootfs.ext4')
              assert info.file_size >= 2_000_000_000
              with tempfile.NamedTemporaryFile(delete=False) as f:
                  f.write(z.read('assets/debian-rootfs.ext4'))
                  p=f.name
          try:
              subprocess.check_call(['e2fsck','-fn',p])
              for path in ['/etc/debian_version','/debootstrap/debootstrap','/usr/local/bin/dev1_guest_bridge']:
                  out=subprocess.check_output(['debugfs','-R',f'stat {path}',p], stderr=subprocess.STDOUT, text=True)
                  assert 'Inode:' in out, path
          finally:
              os.unlink(p)
          print('APK executable ext4 Debian root verification: PASS')
          PY

      - name: Verify APK Signature Schemes
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' apk-signature.txt

      - name: Prepare Verification Metadata
        run: |
          cat <<EOF > verification.json
          {
            "commit": "${{ github.sha }}",
            "version": "0.8.5-dev1",
            "apk_signature_v3": "PASS",
            "debian_bundle": "DEBIAN 13 ARM64 MINBASE INSIDE EXT4 FILESYSTEM IMAGE",
            "execution": "NOEXEC ENCRYPTEDSTORE USED ONLY AS BACKING FILE; DEBIAN ROOT LOOP-MOUNTED EXEC",
            "network_bridge": "DEBIAN GLIBC ARM64 BRIDGE RUNS FROM EXEC ROOT; HOST INTERNET OVER VSOCK",
            "protected_vm_identity": "UNIQUE PER APK VERSION CODE",
            "runtime": "TARGET PHONE RETEST REQUIRED",
            "hardware_acceleration": "NOT PROVEN"
          }
          EOF

      - name: Deploy to Branch-Isolated Rolling Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "dev-1" ]; then TAG="latest-dev-1"; TITLE="Latest Build (dev-1)";
          elif [ "$BRANCH" = "dev-2" ]; then TAG="latest-dev-2"; TITLE="Latest Build (dev-2)";
          else TAG="latest"; TITLE="Latest Build (master)"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TITLE" --notes "Rolling build from branch $BRANCH commit ${{ github.sha }}" --prerelease
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk verification.json apk-signature.txt --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name | select(startswith("DreamLinux-") and endswith(".apk"))' | while IFS= read -r asset; do gh release delete-asset "$TAG" "$asset" --yes; done
          gh release upload "$TAG" build/deliverables/DreamLinux-*.apk --clobber
          gh release edit "$TAG" --notes "Branch $BRANCH; commit ${{ github.sha }}; version 0.8.5-dev1. Debian is now stored in a real ext4 filesystem image. Microdroid encrypted storage remains persistent backing only; the ext4 root is loop-mounted with exec before debootstrap/chroot. Runtime verification requires the target phone."

      - name: Temporary Artifact (1 Day Auto-Expiry)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            verification.json
            apk-signature.txt
            build/deliverables/DreamLinux-*.apk
          retention-days: 1
