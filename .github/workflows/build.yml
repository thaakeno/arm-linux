name: Build APK

on:
  push:
    branches: [ master, main, dev-1, dev-2 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses and Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore persistent development signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Persistent signing key missing; build will run but rolling release publication is disabled."
          fi

      - name: Build and check APK
        run: ./gradlew stageDebugApk testDebugUnitTest lintDebug --no-daemon

      - name: Verify APK Signature Schemes
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' apk-signature.txt
          echo 'AVF-required APK Signature Scheme v3: PASS'

      - name: Prepare Verification Metadata
        run: |
          if [ -f verification.json ]; then
            python3 -c "import json; d=json.load(open('verification.json')); d['commit']='${{ github.sha }}'; d['apk_signature_v3']='PASS'; json.dump(d, open('verification.json','w'), indent=2)"
          else
            cat <<EOF > verification.json
          {
            "commit": "${{ github.sha }}",
            "apk_signature_v3": "PASS",
            "avf_api_path": "android.system.virtualmachine.VirtualMachineManager",
            "vm_creation": "PENDING DEVICE RETEST",
            "vm_boot": "PENDING DEVICE RETEST",
            "connect_vsock": "PENDING",
            "guest_command": "PENDING",
            "debian": "NOT TESTED",
            "gles": "NOT TESTED"
          }
          EOF
          fi

      - name: Deploy to Branch-Isolated Rolling Release
        if: env.STABLE_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "dev-1" ]; then
            TAG="latest-dev-1"
            TITLE="Latest Build (dev-1)"
          elif [ "$BRANCH" = "dev-2" ]; then
            TAG="latest-dev-2"
            TITLE="Latest Build (dev-2)"
          else
            TAG="latest"
            TITLE="Latest Build (master)"
          fi

          echo "Target release tag: $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TITLE" --notes "Rolling build from branch $BRANCH commit ${{ github.sha }}" --prerelease
          # Keep the fixed download URL as an alias, and publish the identifiable APK.
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk verification.json apk-signature.txt --clobber
          # Remove only older versioned APKs from this branch's rolling release.
          gh release view "$TAG" --json assets --jq '.assets[].name | select(startswith("DreamLinux-") and endswith(".apk"))' | while IFS= read -r asset; do
            gh release delete-asset "$TAG" "$asset" --yes
          done
          gh release upload "$TAG" build/deliverables/DreamLinux-*.apk --clobber
          gh release edit "$TAG" --notes "Branch $BRANCH; commit ${{ github.sha }}. Runtime verification requires the target phone."

      - name: Temporary Artifact (1 Day Auto-Expiry)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            verification.json
            apk-signature.txt
            build/deliverables/DreamLinux-*.apk
          retention-days: 1
