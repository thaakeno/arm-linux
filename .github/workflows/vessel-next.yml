name: Vessel Next

on:
  push:
    branches: [ app/vessel-next ]
  pull_request:
    branches: [ dev-1 ]
  workflow_dispatch:

concurrency:
  group: vessel-next-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK/NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"

      - name: Compile, unit-test and lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --no-configuration-cache

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vessel-next-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 3
