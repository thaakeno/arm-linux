name: Vessel Linux APK

on:
  push:
    branches: [ app/vessel-final ]
  workflow_dispatch:

concurrency:
  group: vessel-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"
      - name: Verify Linux-only native desktop tree
        run: |
          set -euxo pipefail
          test ! -e app/src/main/java/com/example/dreamlinux/NativeCubeActivity.kt
          ! find app/src/main -type f | grep -E 'BounceQuest|native_vulkan_studio|native_cube\.(vert|frag)'
          ! find tools/venus_poc -maxdepth 1 -type f | grep -E 'apply_v1[123].*(showcase|playground|postfix)'
          python3 -m py_compile \
            tools/venus_poc/vessel_runtime_daemon_v24.py \
            tools/venus_poc/vessel_runtime_daemon_v25.py \
            tools/venus_poc/vessel_runtime_daemon_v26.py \
            tools/venus_poc/guest_frame_streamer.py \
            tools/venus_poc/guest_input_agent_v25.py
          bash -n tools/venus_poc/run_venus_uml.sh
          grep -F 'REQUIRED_PROTOCOL = 26' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'vessel_runtime_daemon_v26.py' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'VESSEL_MEM_MB="${VESSEL_MEM_MB:-8192}"' tools/venus_poc/run_venus_uml.sh
          grep -F 'mem="${VESSEL_MEM_MB}M"' tools/venus_poc/run_venus_uml.sh
          ! grep -F 'Socket().use' app/src/main/java/com/example/dreamlinux/VncFramebufferView.kt | grep -F '5901'
          grep -F 'FRAME_PORT = 47636' app/src/main/java/com/example/dreamlinux/VncFramebufferView.kt
      - name: Build, test and lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --no-configuration-cache
      - name: Upload Vessel APK
        uses: actions/upload-artifact@v4
        with:
          name: vessel-linux-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
