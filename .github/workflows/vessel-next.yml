name: Vessel Final

on:
  push:
    branches: [ app/vessel-final, app/vessel-next ]
  pull_request:
    branches: [ dev-1, app/vessel-next ]
  workflow_dispatch:

concurrency:
  group: vessel-final-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK/NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"

      - name: Validate rootless runtime controller
        run: |
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v9.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v10.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v11.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v12.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v13.py
          python3 -m py_compile tools/venus_poc/vessel_acceptance.py
          python3 -m py_compile tools/venus_poc/host_relay_direct.py
          python3 -m py_compile tools/venus_poc/guest_relay_direct.py
          bash -n tools/venus_poc/run_venus_uml.sh
          bash -n tools/venus_poc/build_guest_mesa_venus_26_2.sh
          grep -q 'ENABLE_X11' tools/venus_poc/run_venus_uml.sh
          grep -q 'render-server-worker=thread' tools/venus_poc/build_virglrenderer_android_thread.sh
          grep -q 'PROTOCOL_VERSION = 13' tools/venus_poc/vessel_runtime_daemon_v13.py
          grep -q 'rfbunixpath' tools/venus_poc/vessel_runtime_daemon_v13.py
          grep -q 'rfbport -1' tools/venus_poc/vessel_runtime_daemon_v13.py
          grep -q 'socket.AF_UNIX' tools/venus_poc/vessel_runtime_daemon_v13.py
          grep -q 'REQUIRED_PROTOCOL = 13' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -q 'vessel_runtime_daemon_v13.py' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -q 'progressDetail' tools/venus_poc/vessel_runtime_daemon.py
          grep -q 'serve_connection' tools/venus_poc/vessel_runtime_daemon.py
          grep -q 'Virtio-GPU Venus' tools/venus_poc/vessel_acceptance.py
          grep -q 'RFB 003.008' tools/venus_poc/vessel_acceptance.py

      - name: Compile, unit-test and lint
        run: |
          bash ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --no-configuration-cache

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vessel-final-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
