name: Vessel Linux APK

on:
  push:
    branches: [ app/vessel-final ]
  workflow_dispatch:

concurrency:
  group: vessel-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"
      - name: Verify direct X11 desktop architecture
        run: |
          set -euxo pipefail
          test ! -e app/src/main/java/com/example/dreamlinux/NativeCubeActivity.kt
          ! find app/src/main -type f | grep -E 'BounceQuest|native_vulkan_studio|native_cube\.(vert|frag)'
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v29.py
          bash -n tools/venus_poc/run_venus_uml.sh
          grep -F 'REQUIRED_PROTOCOL = 29' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'vessel_runtime_daemon_v29.py' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'lorie-direct-x11-v1' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'implementation(project(":lorie"))' app/build.gradle.kts
          grep -F 'third_party/termux-x11' .gitmodules
          test ! -e app/src/main/cpp/native_desktop_surface.cpp
          test ! -e tools/venus_poc/guest_frame_streamer_v2.c
          test ! -e tools/venus_poc/guest_frame_streamer.py
          ! grep -R -E 'VFRM2|FRAME_STREAMER|ANativeWindow_lock|Xtigervnc|vncserver' app/src/main tools/venus_poc/vessel_runtime_daemon_v29.py
      - name: Build, test and lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --no-configuration-cache
      - name: Upload Vessel APK
        uses: actions/upload-artifact@v4
        with:
          name: vessel-linux-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
