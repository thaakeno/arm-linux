name: Vessel Linux APK

on:
  push:
    branches: [ app/vessel-final ]
  workflow_dispatch:

concurrency:
  group: vessel-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"
      - name: Verify Wayland Venus AHardwareBuffer architecture
        run: |
          set -euxo pipefail
          test ! -e app/src/main/java/com/example/dreamlinux/NativeCubeActivity.kt
          ! find app/src/main -type f | grep -E 'BounceQuest|native_vulkan_studio|native_cube\.(vert|frag)'
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v30.py tools/venus_poc/guest_command_agent.py tools/venus_poc/guest_relay_wayland.py
          bash -n tools/venus_poc/run_venus_wayland.sh
          grep -F 'REQUIRED_PROTOCOL = 30' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'vessel_runtime_daemon_v30.py' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'wayland-venus-ahb-v1' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'VesselWaylandPresenter.attach' app/src/main/java/com/example/dreamlinux/VncFramebufferView.kt
          grep -F 'vessel_wayland_presenter' app/src/main/cpp/CMakeLists.txt
          ! grep -F 'implementation(project(":lorie"))' app/build.gradle.kts
          ! grep -F 'com.termux.x11.MainActivity' app/src/main/AndroidManifest.xml app/src/main/java/com/example/dreamlinux/VncFramebufferView.kt
          test ! -e app/src/main/cpp/native_desktop_surface.cpp
          test ! -e tools/venus_poc/guest_frame_streamer_v2.c
          test ! -e tools/venus_poc/guest_frame_streamer.py
          ! grep -E 'VFRM2|FRAME_STREAMER|ANativeWindow_lock|Xtigervnc|vncserver|lorie-direct-x11-v1' tools/venus_poc/vessel_runtime_daemon_v30.py app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt app/src/main/java/com/example/dreamlinux/VncFramebufferView.kt app/src/main/cpp/CMakeLists.txt
      - name: Compile KWin output backend on Debian 12
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$PWD:/src:ro" \
            -w /src \
            debian:12-slim \
            bash -lc '
              set -euxo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates cmake ninja-build g++ extra-cmake-modules \
                qtbase5-dev libkf5coreaddons-dev kwin-dev \
                libxcb1-dev libepoxy-dev libegl1-mesa-dev libgl-dev
              rm -rf /tmp/vessel-kwin-build
              cmake -S tools/venus_poc/kwin_vessel_output \
                    -B /tmp/vessel-kwin-build \
                    -G Ninja \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_INSTALL_PREFIX=/usr
              cmake --build /tmp/vessel-kwin-build -j2
            '
      - name: Build, test and lint app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --no-configuration-cache
      - name: Upload Vessel APK
        uses: actions/upload-artifact@v4
        with:
          name: vessel-linux-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
