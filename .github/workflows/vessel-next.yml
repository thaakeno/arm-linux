name: Vessel Final

on:
  push:
    branches: [ app/vessel-next ]
  pull_request:
    branches: [ dev-1, app/vessel-next ]
  workflow_dispatch:

concurrency:
  group: vessel-final-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK/NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"

      - name: Fetch Vulkan Studio offline assets
        run: |
          set -euxo pipefail
          ASSETS=app/src/main/assets/vulkan_v7
          THIRD=app/src/main/cpp/third_party
          mkdir -p "$ASSETS" "$THIRD"
          UA='Vessel-Vulkan-Studio-v10/1.0 (offline APK asset build)'
          get() { curl --fail --location --retry 4 --retry-delay 2 --user-agent "$UA" "$1" --output "$2"; test -s "$2"; }

          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/cobblestone_pavement/cobblestone_pavement_diff_2k.jpg' "$ASSETS/cobblestone_diff_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/cobblestone_pavement/cobblestone_pavement_nor_gl_2k.jpg' "$ASSETS/cobblestone_nor_gl_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/cobblestone_pavement/cobblestone_pavement_arm_2k.jpg' "$ASSETS/cobblestone_arm_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/png/2k/cobblestone_pavement/cobblestone_pavement_disp_2k.png' "$ASSETS/cobblestone_disp_2k.png"

          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rough_concrete/rough_concrete_diff_2k.jpg' "$ASSETS/rough_concrete_diff_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rough_concrete/rough_concrete_nor_gl_2k.jpg' "$ASSETS/rough_concrete_nor_gl_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rough_concrete/rough_concrete_arm_2k.jpg' "$ASSETS/rough_concrete_arm_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/png/2k/rough_concrete/rough_concrete_disp_2k.png' "$ASSETS/rough_concrete_disp_2k.png"

          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/dark_rock/dark_rock_diff_2k.jpg' "$ASSETS/dark_rock_diff_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/dark_rock/dark_rock_nor_gl_2k.jpg' "$ASSETS/dark_rock_nor_gl_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/dark_rock/dark_rock_arm_2k.jpg' "$ASSETS/dark_rock_arm_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/png/2k/dark_rock/dark_rock_disp_2k.png' "$ASSETS/dark_rock_disp_2k.png"

          get 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/evening_museum_courtyard_1k.hdr' "$ASSETS/evening_museum_courtyard_1k.hdr"
          get 'https://raw.githubusercontent.com/nothings/stb/master/stb_image.h' "$THIRD/stb_image.h"
          du -h "$ASSETS"/*

      - name: Validate rootless runtime and Vulkan Studio v10
        run: |
          set -euxo pipefail
          for f in tools/venus_poc/vessel_runtime_daemon.py \
                   tools/venus_poc/vessel_runtime_daemon_v22.py \
                   tools/venus_poc/vessel_acceptance.py \
                   tools/venus_poc/host_relay_direct.py \
                   tools/venus_poc/guest_relay_direct.py; do
            python3 -m py_compile "$f"
          done
          bash -n tools/venus_poc/run_venus_uml.sh
          bash -n tools/venus_poc/build_guest_mesa_venus_26_2.sh
          bash -n tools/venus_poc/build_uml_smp_android.sh
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'tools/venus_poc/vessel_runtime_daemon_v22.py': ['PROTOCOL_VERSION = 22', 'network_v22', 'VESSEL_MEM_MB'],
              'app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt': ['REQUIRED_PROTOCOL = 22', 'VESSEL_MEM_MB=8192'],
              'app/src/main/java/com/example/dreamlinux/NativeCubeActivity.kt': [
                  'SurfaceView', 'System.loadLibrary("vessel_vulkan")', 'VULKAN TELEMETRY',
                  'nativeSetStress', 'nativeSetQuality', 'nativeSetPhysics', 'nativeSetRt', 'nativeGrabLightStart',
                  'nativeSetLightIntensity', 'nativeSetLightHaze', 'nativeSetLightBounce',
                  'VULKAN STUDIO  //  v10.0', 'RAIN HOUSE', '0.50x'
              ],
              'app/src/main/cpp/CMakeLists.txt': [
                  'add_library(vessel_vulkan SHARED native_vulkan_studio_v7.cpp)',
                  'native_studio_v7_rt.frag', 'target_link_libraries(vessel_vulkan PRIVATE android log vulkan)'
              ],
              'app/src/main/cpp/native_vulkan_studio_v7_part1.inc': [
                  'adaptive RT budget', 'physical puddles', 'setWetness', 'setHeroMaterial', '0.50x',
                  'setLightIntensity', 'setLightHaze', 'setLightBounce', 'rain-window house'
              ],
              'app/src/main/cpp/native_vulkan_studio_v7_part4.inc': [
                  'cmdUpdateTlasV7', 'rtBudgetV7', 'VK_ERROR_DEVICE_LOST', 'adaptRtSafetyV7',
                  'house shell + furniture', 'dynamicSceneV7'
              ],
              'app/src/main/cpp/native_vulkan_studio_v7_part5.inc': ['Vulkan Studio v10.0', 'RAIN HOUSE', '0.50'],
              'app/src/main/cpp/shaders/native_studio_v7_rt.frag': [
                  'GL_EXT_ray_query', 'rayQueryInitializeEXT', 'traceScene', 'stablePathIndirect', 'heroWetMask', 'rtBudget',
                  'TORCH0', 'TORCH1', 'FIREPLACE', 'rainyLandscape', 'windowColor'
              ],
              'app/src/main/cpp/shaders/native_studio_v7.vert': [
                  'HERO_GRID=48', 'FLOOR_GRID=96', 'LEAVES=192', 'emitSky', 'rainy window L', 'wall TV'
              ],
          }
          for path, needles in checks.items():
              text = Path(path).read_text()
              for needle in needles:
                  assert needle in text, f'{needle!r} missing from {path}'
          for name in [
              'cobblestone_diff_2k.jpg','cobblestone_nor_gl_2k.jpg','cobblestone_arm_2k.jpg','cobblestone_disp_2k.png',
              'rough_concrete_diff_2k.jpg','rough_concrete_nor_gl_2k.jpg','rough_concrete_arm_2k.jpg','rough_concrete_disp_2k.png',
              'dark_rock_diff_2k.jpg','dark_rock_nor_gl_2k.jpg','dark_rock_arm_2k.jpg','dark_rock_disp_2k.png',
              'evening_museum_courtyard_1k.hdr',
          ]:
              p = Path('app/src/main/assets/vulkan_v7') / name
              assert p.stat().st_size > 1024, f'asset too small: {p}'
          PY

      - name: Compile, unit-test and lint
        run: |
          bash ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --no-configuration-cache

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vessel-final-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7