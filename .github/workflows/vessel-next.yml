name: Vessel Final

on:
  push:
    branches: [ app/vessel-next ]
  pull_request:
    branches: [ dev-1, app/vessel-next ]
  workflow_dispatch:

concurrency:
  group: vessel-final-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK/NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"

      - name: Fetch Vulkan Studio v6 offline assets
        run: |
          set -euxo pipefail
          ASSETS=app/src/main/assets/vulkan_v6
          THIRD=app/src/main/cpp/third_party
          mkdir -p "$ASSETS" "$THIRD"
          UA='Vessel-Vulkan-Studio-v6/1.0 (offline APK asset build)'
          get() { curl --fail --location --retry 4 --retry-delay 2 --user-agent "$UA" "$1" --output "$2"; test -s "$2"; }

          # CC0 Poly Haven material maps. Downloaded only during build; the APK is fully offline at runtime.
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/slab_tiles/slab_tiles_diff_2k.jpg' "$ASSETS/slab_tiles_diff_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/slab_tiles/slab_tiles_nor_gl_2k.jpg' "$ASSETS/slab_tiles_nor_gl_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/slab_tiles/slab_tiles_arm_2k.jpg' "$ASSETS/slab_tiles_arm_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/png/2k/slab_tiles/slab_tiles_disp_2k.png' "$ASSETS/slab_tiles_disp_2k.png"

          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rough_concrete/rough_concrete_diff_2k.jpg' "$ASSETS/rough_concrete_diff_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rough_concrete/rough_concrete_nor_gl_2k.jpg' "$ASSETS/rough_concrete_nor_gl_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rough_concrete/rough_concrete_arm_2k.jpg' "$ASSETS/rough_concrete_arm_2k.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/png/2k/rough_concrete/rough_concrete_disp_2k.png' "$ASSETS/rough_concrete_disp_2k.png"

          get 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/evening_museum_courtyard_1k.hdr' "$ASSETS/evening_museum_courtyard_1k.hdr"
          get 'https://raw.githubusercontent.com/nothings/stb/master/stb_image.h' "$THIRD/stb_image.h"

          du -h "$ASSETS"/*

      - name: Validate rootless runtime controller
        run: |
          set -euxo pipefail
          for f in tools/venus_poc/vessel_runtime_daemon.py \
                   tools/venus_poc/vessel_runtime_daemon_v9.py \
                   tools/venus_poc/vessel_runtime_daemon_v10.py \
                   tools/venus_poc/vessel_runtime_daemon_v11.py \
                   tools/venus_poc/vessel_runtime_daemon_v12.py \
                   tools/venus_poc/vessel_runtime_daemon_v13.py \
                   tools/venus_poc/vessel_runtime_daemon_v14.py \
                   tools/venus_poc/vessel_runtime_daemon_v15.py \
                   tools/venus_poc/vessel_runtime_daemon_v16.py \
                   tools/venus_poc/vessel_runtime_daemon_v17.py \
                   tools/venus_poc/vessel_runtime_daemon_v18.py \
                   tools/venus_poc/vessel_runtime_daemon_v19.py \
                   tools/venus_poc/vessel_runtime_daemon_v20.py \
                   tools/venus_poc/vessel_runtime_daemon_v21.py \
                   tools/venus_poc/vessel_runtime_daemon_v22.py \
                   tools/venus_poc/vessel_acceptance.py \
                   tools/venus_poc/host_relay_direct.py \
                   tools/venus_poc/guest_relay_direct.py; do
            python3 -m py_compile "$f"
          done
          bash -n tools/venus_poc/run_venus_uml.sh
          bash -n tools/venus_poc/build_guest_mesa_venus_26_2.sh
          bash -n tools/venus_poc/build_uml_smp_android.sh
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'tools/venus_poc/vessel_runtime_daemon_v22.py': [
                  'PROTOCOL_VERSION = 22', 'network_v22', 'VESSEL_MEM_MB',
                  'start_xtigervnc_v22', 'desktop_action_v22',
              ],
              'tools/venus_poc/run_venus_uml.sh': [
                  'VESSEL_VCPUS="${VESSEL_VCPUS:-6}"', 'ncpus="$VESSEL_VCPUS"',
              ],
              'tools/venus_poc/build_uml_smp_android.sh': [
                  'CONFIG_SMP=y', 'CONFIG_NR_CPUS=8', 'apply_umshm.py',
                  'fix_umshm_nonblock.py', 'fix_umshm_ptrace_fds.py',
              ],
              'app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt': [
                  'REQUIRED_PROTOCOL = 22', 'vessel_runtime_daemon_v22.py', 'VESSEL_MEM_MB=8192',
              ],
              'app/src/main/java/com/example/dreamlinux/VncFramebufferView.kt': [
                  'TRACKPAD', 'getHistoricalX', 'showKeyboard', 'out.flush()',
              ],
              'app/src/main/java/com/example/dreamlinux/VesselActivity.kt': [
                  'FullscreenDesktop', 'Open native 3D cube', 'protocol 22', '8 GB UML memory',
              ],
              'app/src/main/java/com/example/dreamlinux/NativeCubeActivity.kt': [
                  'SurfaceView', 'System.loadLibrary("vessel_vulkan")',
                  'Vessel Vulkan Studio v6', 'Orbit · pinch zoom',
                  'VULKAN LOG', 'nativeSetStress', 'nativeSetQuality',
                  'nativeSetPhysics', 'nativeSetRt', 'nativeGrabLightStart',
                  'Full Vulkan log copied',
              ],
              'app/src/main/cpp/CMakeLists.txt': [
                  'add_library(vessel_vulkan SHARED native_vulkan_studio_v6.cpp)',
                  'target_link_libraries(vessel_vulkan PRIVATE android log vulkan)',
                  'native_studio_v6_rt.frag',
              ],
              'app/src/main/cpp/native_vulkan_studio_v3.cpp': [
                  'VK_KHR_RAY_QUERY_EXTENSION_NAME', 'vkCmdBuildAccelerationStructuresKHR',
              ],
              'app/src/main/cpp/native_vulkan_studio_v6.cpp': [
                  'native_studio_v6_rt_frag_spv', 'rebuildTlasV6', 'cmdUpdateTlasV6',
                  'physicsStepV6', 'loadTexturesV6', 'rough_concrete_diff_2k.jpg',
                  'evening_museum_courtyard_1k.hdr', 'nativeGrabLightStart',
              ],
              'app/src/main/cpp/shaders/native_studio_v6_rt.frag': [
                  'GL_EXT_ray_query', 'rayQueryInitializeEXT', 'traceScene',
                  'floorAlbedo', 'environmentMap', 'transmission', 'anisotropy',
              ],
              'app/src/main/cpp/shaders/native_studio_v6.vert': [
                  'concreteHeight', 'floorHeight', 'HERO_GRID', 'ARCH_BOXES',
              ],
          }
          for path, needles in checks.items():
              text = Path(path).read_text()
              for needle in needles:
                  assert needle in text, f'{needle!r} missing from {path}'
          for name in [
              'slab_tiles_diff_2k.jpg', 'slab_tiles_nor_gl_2k.jpg', 'slab_tiles_arm_2k.jpg', 'slab_tiles_disp_2k.png',
              'rough_concrete_diff_2k.jpg', 'rough_concrete_nor_gl_2k.jpg', 'rough_concrete_arm_2k.jpg', 'rough_concrete_disp_2k.png',
              'evening_museum_courtyard_1k.hdr',
          ]:
              p = Path('app/src/main/assets/vulkan_v6') / name
              assert p.stat().st_size > 1024, f'asset too small: {p}'
          PY

      - name: Compile, unit-test and lint
        run: |
          bash ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --no-configuration-cache

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vessel-final-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
