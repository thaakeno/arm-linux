name: Vessel Final

on:
  push:
    branches: [ app/vessel-final, app/vessel-next ]
  pull_request:
    branches: [ dev-1, app/vessel-next ]
  workflow_dispatch:

concurrency:
  group: vessel-final-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK/NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"

      - name: Validate rootless runtime controller
        run: |
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v9.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v10.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v11.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v12.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v13.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v14.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v15.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v16.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v17.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v18.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v19.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v20.py
          python3 -m py_compile tools/venus_poc/vessel_runtime_daemon_v21.py
          python3 -m py_compile tools/venus_poc/vessel_acceptance.py
          python3 -m py_compile tools/venus_poc/host_relay_direct.py
          python3 -m py_compile tools/venus_poc/guest_relay_direct.py
          bash -n tools/venus_poc/run_venus_uml.sh
          bash -n tools/venus_poc/build_guest_mesa_venus_26_2.sh
          grep -q 'render-server-worker=thread' tools/venus_poc/build_virglrenderer_android_thread.sh
          grep -q 'PROTOCOL_VERSION = 21' tools/venus_poc/vessel_runtime_daemon_v21.py
          grep -q 'prepare_venus_v21' tools/venus_poc/vessel_runtime_daemon_v21.py
          grep -q 'VESSEL_MEM_MB:-4096' tools/venus_poc/vessel_runtime_daemon_v21.py
          grep -q 'REQUIRED_PROTOCOL = 21' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -q 'vessel_runtime_daemon_v21.py' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -q 'PointerMode.TRACKPAD' app/src/main/java/com/example/dreamlinux/VncFramebufferView.kt
          grep -q 'getHistoricalX' app/src/main/java/com/example/dreamlinux/VncFramebufferView.kt
          grep -q 'showKeyboard' app/src/main/java/com/example/dreamlinux/VncFramebufferView.kt
          grep -q 'FullscreenDesktop' app/src/main/java/com/example/dreamlinux/VesselActivity.kt
          grep -q 'Vulkan 3D test' app/src/main/java/com/example/dreamlinux/VesselActivity.kt

      - name: Compile, unit-test and lint
        run: |
          bash ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --no-configuration-cache

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vessel-final-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
