name: Bounce Quest

on:
  push:
    branches: [ app/bounce-quest ]
  workflow_dispatch:

concurrency:
  group: bounce-quest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"

      - name: Fetch CC0 PBR/audio and compile authored scene assets
        run: |
          set -euxo pipefail
          A=app/src/main/assets/bounce
          R=app/src/main/res/raw
          T=app/src/main/cpp/third_party
          M="$A/material-src"
          mkdir -p "$A" "$R" "$T" "$M"
          get(){ curl --fail --location --retry 5 --retry-delay 2 "$1" -o "$2"; test -s "$2"; }

          # Three genuinely different CC0 PBR surfaces are packed into one atlas so the
          # mobile renderer keeps only three material samplers: concrete, wood and metal.
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/concrete_floor/concrete_floor_diff_1k.jpg' "$M/concrete_diff.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/concrete_floor/concrete_floor_nor_gl_1k.jpg' "$M/concrete_normal.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/concrete_floor/concrete_floor_arm_1k.jpg' "$M/concrete_arm.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/wood_planks/wood_planks_diff_1k.jpg' "$M/wood_diff.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/wood_planks/wood_planks_nor_gl_1k.jpg' "$M/wood_normal.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/wood_planks/wood_planks_arm_1k.jpg' "$M/wood_arm.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/painted_metal_shutter/painted_metal_shutter_diff_1k.jpg' "$M/metal_diff.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/painted_metal_shutter/painted_metal_shutter_nor_gl_1k.jpg' "$M/metal_normal.jpg"
          get 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/painted_metal_shutter/painted_metal_shutter_arm_1k.jpg' "$M/metal_arm.jpg"
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          A=Path('app/src/main/assets/bounce');M=A/'material-src'
          for out,names in {
              'concrete_diff.jpg':['concrete_diff.jpg','wood_diff.jpg','metal_diff.jpg'],
              'concrete_normal.jpg':['concrete_normal.jpg','wood_normal.jpg','metal_normal.jpg'],
              'concrete_arm.jpg':['concrete_arm.jpg','wood_arm.jpg','metal_arm.jpg'],
          }.items():
              atlas=Image.new('RGB',(1024,3072))
              for i,name in enumerate(names):
                  im=Image.open(M/name).convert('RGB').resize((1024,1024),Image.Resampling.LANCZOS)
                  atlas.paste(im,(0,i*1024))
              atlas.save(A/out,quality=93,optimize=True)
          PY
          rm -rf "$M"

          get 'https://raw.githubusercontent.com/nothings/stb/master/stb_image.h' "$T/stb_image.h"
          python3 tools/build_bounce_scene.py
          test -s "$A/scene.bqmesh"
          test -s "$A/alps.jpg"

          BASE='https://raw.githubusercontent.com/Sonofg0tham/tailgate/main/public/assets/audio'
          get "$BASE/footstep-carpet-1.ogg" "$R/bq_bounce_1.ogg"
          get "$BASE/footstep-carpet-2.ogg" "$R/bq_bounce_2.ogg"
          get "$BASE/badge-accept.ogg" "$R/bq_collect.ogg"
          get "$BASE/breaker-trip.ogg" "$R/bq_jump.ogg"
          get "$BASE/bolt-throw.ogg" "$R/bq_dash.ogg"
          get "$BASE/badge-deny.ogg" "$R/bq_death.ogg"
          get "$BASE/plant-complete.ogg" "$R/bq_win.ogg"

      - name: Verify clean authored game tree
        run: |
          set -eux
          test -f app/src/main/cpp/engine/renderer/BounceRenderer.cpp
          test -f app/src/main/cpp/engine/physics/BallPhysics.cpp
          test -f app/src/main/cpp/engine/game/Level.h
          test -f tools/build_bounce_scene.py
          test ! -f tools/fix_bounce_launch.py
          grep -q 'requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE' app/src/main/java/com/example/dreamlinux/BounceQuestActivity.kt
          grep -q 'if(thread_.joinable())thread_.join()' app/src/main/cpp/engine/renderer/BounceRenderer.cpp
          grep -q "wooden_crate_01" tools/build_bounce_scene.py
          grep -q "for row,z in enumerate" tools/build_bounce_scene.py
          ! grep -R "native_vulkan_studio_v7" app/src/main/cpp/CMakeLists.txt
          ! grep -R "platformInfo(" app/src/main/cpp/engine/renderer/shaders
          ! grep -R "boxGeom(" app/src/main/cpp/engine/renderer/shaders

      - name: Build and validate Vessel APK
        run: bash ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --no-configuration-cache

      - name: Upload Vessel + Bounce Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: vessel-bounce-quest-authored-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
