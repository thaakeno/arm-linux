name: Vessel APK

on:
  push:
    branches: [ arch/vessel-self-contained ]
    paths:
      - 'app/**'
      - 'tools/vessel_native/**'
      - 'tools/vessel_proroot/**'
      - '.github/workflows/vessel-self-contained.yml'
      - '.github/workflows/vessel-proroot-rootfs.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [ arch/vessel-self-contained ]
    paths:
      - 'app/**'
      - 'tools/vessel_native/**'
      - 'tools/vessel_proroot/**'
      - '.github/workflows/vessel-self-contained.yml'
      - '.github/workflows/vessel-proroot-rootfs.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

concurrency:
  group: vessel-self-contained-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  source-check:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Stage official proroot runtime
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x tools/vessel_proroot/fetch_official_proroot.sh
          tools/vessel_proroot/fetch_official_proroot.sh app/src/main/jniLibs/arm64-v8a
          cd app/src/main/jniLibs/arm64-v8a
          printf '%s  %s\n'             a4e74d75b66cdc02b080adfe863dbf9951c3b30610d77beddc95488d5fe5de01 libproroot.so             8c47a0a7db32d84c179ebb5bf3640f655a3181860ece5886ae44d92858730c34 libproroot-runtime.so             1c5bc9537a270e8bf8b1c70222813f57b60b828bfb5503ddf8fe37685092de2f libproroot-bridge.so             51a0ec5bfed00e572a0de09e22d9057e2befc386b78e426613d3e0ab03f4ecee libproroot-linker.so             06c6624db3bdc45b9ced151cd781df439a37b47731d244b93e9d6a58cd48cde0 libproroot-stub-loader.so             | sha256sum -c -
          cd "$GITHUB_WORKSPACE"

      - name: Compile Kotlin and run host unit tests
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --build-cache
      - name: Syntax-check authoritative PTY C
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"             --sysroot="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"             -std=c11 -Wall -Wextra -Werror -Os -fsyntax-only             app/src/main/cpp/third_party/termux/vessel_termux_pty.c
      - name: Validate direct-GPU rootfs contract
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m json.tool tools/vessel_proroot/direct_gpu_manifest.json >/dev/null
          python3 tools/vessel_native/verify_proroot_source_contract.py
          bash -n tools/vessel_proroot/install_direct_gpu_mesa.sh
          grep -F 'MESA_LOADER_DRIVER_OVERRIDE" to "kgsl"' app/src/main/java/com/example/dreamlinux/VesselDirectGpu.kt
          grep -F 'GALLIUM_DRIVER" to "freedreno"' app/src/main/java/com/example/dreamlinux/VesselDirectGpu.kt
          grep -F 'TURNIP_KMD" to "kgsl"' app/src/main/java/com/example/dreamlinux/VesselDirectGpu.kt
          ! grep -Fq '"MESA_LOADER_DRIVER_OVERRIDE" to "zink"' app/src/main/java/com/example/dreamlinux/VesselDirectGpu.kt
          ! grep -Fq '"LD_LIBRARY_PATH"' app/src/main/java/com/example/dreamlinux/VesselDirectGpu.kt
          grep -F 'c014cf66bdbff96417ee30d34f006cf51df64ae04893d599711b0b6b73b52ccf' tools/vessel_proroot/direct_gpu_manifest.json

      - name: Syntax-check Phase 4 native runtime
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          for src in             app/src/main/cpp/vessel_proroot_display_bridge.cpp             app/src/main/cpp/vessel_proroot_surfacecontrol.cpp             app/src/main/cpp/vessel_surface_presenter.cpp
          do
            "$CXX" --sysroot="$SYSROOT"               -std=c++17 -Wall -Wextra -Werror               -Wno-unused-parameter -Wno-missing-field-initializers -Wno-misleading-indentation -Wno-unused-function               -fsyntax-only "$src"
          done

      - name: Validate Phase 4 desktop compatibility contract
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m json.tool tools/vessel_proroot/desktop_manifest.json >/dev/null
          bash -n tools/vessel_proroot/install_desktop_runtime.sh
          bash -n tools/vessel_proroot/rootfs/usr/local/libexec/vessel-start-plasma
          bash -n tools/vessel_proroot/rootfs/usr/local/libexec/vessel-compat-probe
          bash -n tools/vessel_proroot/rootfs/usr/local/lib/vessel/kwin-wrapper/kwin_wayland
          bash -n tools/vessel_proroot/rootfs/usr/local/lib/vessel/kwin-wrapper/kwin_wayland_wrapper
          grep -F 'proroot-kgsl-' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'VesselProrootIdentity(' app/src/main/java/com/example/dreamlinux/VesselProrootLaunchPlan.kt
          grep -F 'fakeRoot = false' app/src/main/java/com/example/dreamlinux/VesselProrootCompatibility.kt
          grep -F 'dbus-run-session' tools/vessel_proroot/rootfs/usr/local/libexec/vessel-start-plasma
          grep -F 'SCM_CREDENTIALS' tools/vessel_proroot/rootfs/usr/local/libexec/vessel-compat-probe
          grep -F 'os.memfd_create' tools/vessel_proroot/rootfs/usr/local/libexec/vessel-compat-probe
          ! grep -R -E -- '--no-sandbox|MOZ_DISABLE_CONTENT_SANDBOX|security\.sandbox\.content\.level'             app/src/main/java/com/example/dreamlinux/VesselProroot*.kt             tools/vessel_proroot/rootfs
          ! grep -R -F 'LIBGL_ALWAYS_SOFTWARE=1'             app/src/main/java/com/example/dreamlinux/VesselProroot*.kt             tools/vessel_proroot/rootfs

      - name: Validate Phase 5 zero-copy and battery contract
        shell: bash
        run: |
          set -euxo pipefail
          grep -F 'proroot-kgsl-surfacecontrol-ahb-fence-v2' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'ASurfaceTransaction_setBufferWithRelease' app/src/main/cpp/vessel_proroot_surfacecontrol.cpp
          grep -F 'ASurfaceTransaction_setEnableBackPressure' app/src/main/cpp/vessel_proroot_surfacecontrol.cpp
          grep -F 'AHARDWAREBUFFER_USAGE_COMPOSER_OVERLAY' app/src/main/cpp/vessel_proroot_display_bridge.cpp
          ! grep -Fq 'AHARDWAREBUFFER_USAGE_CPU_READ' app/src/main/cpp/vessel_proroot_display_bridge.cpp
          ! grep -E 'gl(ReadPixels|BlitFramebuffer)|AHardwareBuffer_lock'             app/src/main/cpp/vessel_proroot_display_bridge.cpp             app/src/main/cpp/vessel_proroot_surfacecontrol.cpp
          grep -F 'const val IDLE_MAX_HZ = 60f' app/src/main/java/com/example/dreamlinux/VesselPerformancePolicy.kt
          grep -F 'const val IDLE_DELAY_MS = 1800L' app/src/main/java/com/example/dreamlinux/VesselPerformancePolicy.kt
          grep -F 'surface.setFrameRate(' app/src/main/java/com/example/dreamlinux/LinuxDesktopView.kt
          grep -F '0f,' app/src/main/java/com/example/dreamlinux/LinuxDesktopView.kt
          grep -F 'usesGuestCursorOverlay()' app/src/main/java/com/example/dreamlinux/LinuxDesktopView.kt
          grep -F 'activeBinds.keys.none(::isDynamic)' app/src/main/java/com/example/dreamlinux/VesselProcCompat.kt

          # Compile an API-30 object and prove the API-36 release function is
          # resolved at runtime rather than becoming a hard loader dependency.
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++"
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          "$CXX" --sysroot="$SYSROOT" -std=c++17 -Wall -Wextra -Werror             -fPIC -c app/src/main/cpp/vessel_proroot_surfacecontrol.cpp             -o /tmp/vessel-proroot-surfacecontrol.o
          ! "$NM" -u /tmp/vessel-proroot-surfacecontrol.o | grep -F 'ASurfaceTransaction_setBufferWithRelease'
 
      - name: Validate Phase 6 production cutover
        shell: bash
        run: |
          set -euxo pipefail

          grep -F 'const val ACTIVE_BACKEND_ID = "proroot"' app/src/main/java/com/example/dreamlinux/VesselRuntimeFactory.kt
          grep -F 'const val RECOVERY_BACKEND_ID = "uml"' app/src/main/java/com/example/dreamlinux/VesselRuntimeFactory.kt
          grep -F 'VesselProrootRuntimeBackend(context, progress)' app/src/main/java/com/example/dreamlinux/VesselRuntimeFactory.kt
          ! grep -Fq 'createProrootScaffold' app/src/main/java/com/example/dreamlinux/VesselTerminalManager.kt

          grep -F 'android:name=".VesselProrootBootstrapActivity"' app/src/main/AndroidManifest.xml
          grep -A5 -F 'android:name=".VesselProrootBootstrapActivity"' app/src/main/AndroidManifest.xml | grep -F 'android:exported="true"'
          grep -F 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml
          grep -F 'vessel-proroot-rootfs-v1-edge' app/src/main/java/com/example/dreamlinux/VesselProrootBootstrapActivity.kt
          grep -F 'VesselRootfsReleaseContract.incompatibility' app/src/main/java/com/example/dreamlinux/VesselProrootBootstrapActivity.kt
          grep -F 'Rootfs archive contains unsupported hard link' app/src/main/java/com/example/dreamlinux/VesselProrootBootstrapActivity.kt
          grep -F 'debian-arm64.staging' app/src/main/java/com/example/dreamlinux/VesselProrootBootstrapActivity.kt
          grep -F 'stagingRootfs.renameTo(live)' app/src/main/java/com/example/dreamlinux/VesselProrootBootstrapActivity.kt
          grep -F 'Rootfs traversal rejected' app/src/main/java/com/example/dreamlinux/VesselProrootBootstrapActivity.kt
          grep -F 'Recovery is explicit' app/src/main/java/com/example/dreamlinux/VesselProrootBootstrapActivity.kt
          grep -F 'installedRootfsReadiness().ready' app/src/main/java/com/example/dreamlinux/VesselProrootBootstrapActivity.kt
          grep -F 'fun installedRootfsReadiness()' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'fun rootfsReadiness(rootfs: File)' app/src/main/java/com/example/dreamlinux/VesselDirectGpu.kt
          grep -F 'fun baseReadiness(rootfs: File)' app/src/main/java/com/example/dreamlinux/VesselProrootCompatibility.kt

          grep -F 'const val REVISION = "proroot-production-v16"' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'proroot-production-v1' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'ConnectivityManager' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'getLinkProperties' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'direct-proroot' app/src/main/java/com/example/dreamlinux/VmSessionService.kt
          grep -F 'runtime.kind == VesselRuntimeKind.PROROOT || VesselGuestAgent.isConnected()' app/src/main/java/com/example/dreamlinux/VmSessionService.kt

          # Non-interactive proroot startup must use Android ProcessBuilder +
          # setsid, never fork the live ART process from JNI.
          grep -F 'ProcessBuilder(supervisorCommand(plan))' app/src/main/java/com/example/dreamlinux/VesselProrootProcess.kt
          grep -F 'const val SETSID = "/system/bin/setsid"' app/src/main/java/com/example/dreamlinux/VesselProrootProcess.kt
          grep -F 'captureSpawnedLeader(pid, 2500)' app/src/main/java/com/example/dreamlinux/VesselProrootProcess.kt
          ! grep -Fq 'VesselProrootProcessNative.spawn' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          ! grep -Fq 'vessel_proroot_process.cpp' app/src/main/cpp/CMakeLists.txt
          grep -F 'proroot.smoke.begin' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'display.bridge.begin' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'startup-journal.log' app/src/main/java/com/example/dreamlinux/VmSessionService.kt

          # Proroot desktop readiness belongs to the exact Plasma D-Bus session.
          # Never spawn a second pgrep/procfs helper that can falsely kill a live
          # compositor after a valid SurfaceControl frame has already arrived.
          grep -F 'org.freedesktop.DBus.NameHasOwner' tools/vessel_proroot/rootfs/usr/local/libexec/vessel-start-plasma
          grep -F 'org.kde.plasmashell' tools/vessel_proroot/rootfs/usr/local/libexec/vessel-start-plasma
          grep -F 'plasmaDbusReady' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          ! grep -Fq 'pgrep -x kwin_wayland' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          ! grep -Fq 'pgrep -x kwin_wayland' app/src/main/java/com/example/dreamlinux/VmSessionService.kt
          bash -n app/src/main/assets/vessel/vessel-start-plasma
          cmp tools/vessel_proroot/rootfs/usr/local/libexec/vessel-start-plasma app/src/main/assets/vessel/vessel-start-plasma

          # Diagnostics must expose complete named logs instead of only a
          # 6 KiB/18-line tail, and missing UML is an explicit install choice.
          grep -F 'PROROOT_DIAGNOSTIC_LOGS' app/src/main/java/com/example/dreamlinux/VmSessionService.kt
          grep -F 'Full runtime logs' app/src/main/java/com/example/dreamlinux/VesselActivity.kt
          grep -F 'selectedDiagnosticText' app/src/main/java/com/example/dreamlinux/VesselActivity.kt
          grep -F 'readAllDiagnosticLogs()' app/src/main/java/com/example/dreamlinux/VesselActivity.kt
          grep -F 'Copy all' app/src/main/java/com/example/dreamlinux/VesselActivity.kt
          grep -F 'plasma-qml-runtime-probe.log' app/src/main/java/com/example/dreamlinux/VmSessionService.kt
          grep -F 'VESSEL_KWIN_WRAPPER_V16' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'File(layout.rootfsDir, "usr/bin/Xwayland")' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F '/usr/bin/qmlscene6 /var/cache/vessel/vessel-qml-probe.qml' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          ! grep -Fq 'export PATH="/usr/local/lib/vessel/kwin-wrapper:$PATH"' tools/vessel_proroot/rootfs/usr/local/libexec/vessel-start-plasma
          ! grep -Fq 'export PATH="/usr/local/lib/vessel/kwin-wrapper:$PATH"' app/src/main/assets/vessel/vessel-start-plasma
          grep -F 'Install UML recovery' app/src/main/java/com/example/dreamlinux/VesselActivity.kt
          grep -F 'VesselBootstrapActivityV2::class.java' app/src/main/java/com/example/dreamlinux/VesselActivity.kt
          grep -F 'vessel.selectUmlAfterInstall' app/src/main/java/com/example/dreamlinux/VesselActivity.kt
          grep -F 'VesselExperimentConfig.setRuntimeBackend(this, VesselRuntimeFactory.RECOVERY_BACKEND_ID)' app/src/main/java/com/example/dreamlinux/VesselBootstrapActivityV2.kt

          # Rootless system D-Bus must never use Debian's stock <user>messagebus
          # privilege drop. The runtime actively proves RequestName before Plasma.
          grep -F 'object VesselRootlessSystemBus' app/src/main/java/com/example/dreamlinux/VesselRootlessSystemBus.kt
          grep -F '<type>system</type>' app/src/main/java/com/example/dreamlinux/VesselRootlessSystemBus.kt
          grep -F '<auth>EXTERNAL</auth>' app/src/main/java/com/example/dreamlinux/VesselRootlessSystemBus.kt
          grep -F 'getElementsByTagName("user").length' app/src/test/java/com/example/dreamlinux/VesselRootlessSystemBusTest.kt
          grep -F 'org.freedesktop.DBus.RequestName' app/src/main/java/com/example/dreamlinux/VesselRootlessSystemBus.kt
          grep -F 'VESSEL_SYSTEM_DBUS_OK' app/src/main/java/com/example/dreamlinux/VesselRootlessSystemBus.kt
          grep -F 'system-dbus-probe.log' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'DBUS_SYSTEM_BUS_ADDRESS' app/src/main/java/com/example/dreamlinux/VesselProrootCompatibility.kt
          grep -F 'ok "dbus-system"' tools/vessel_proroot/rootfs/usr/local/libexec/vessel-compat-probe

          # Android may deny readlink(/proc/self/exe). Upstream proroot exposes
          # PROROOT_GUEST_EXE specifically to emulate the Linux guest path.
          grep -F '"PROROOT_GUEST_EXE" to guestExecutable' app/src/main/java/com/example/dreamlinux/VesselProrootLaunchPlan.kt
          grep -F '"PROROOT_GUEST_EXE",' app/src/main/java/com/example/dreamlinux/VesselProrootLaunchPlan.kt
          grep -F 'proc.self-exe.begin' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F '"/usr/bin/readlink", "/proc/self/exe"' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'proc-self-exe.log' app/src/main/java/com/example/dreamlinux/VmSessionService.kt

          # Compatibility semantics are APK-owned so a stale 1.4 GiB rootfs
          # cannot reintroduce obsolete Android procfs assumptions.
          grep -F 'object VesselProrootCompatibilityProbe' app/src/main/java/com/example/dreamlinux/VesselProrootCompatibilityProbe.kt
          grep -F 'os.readlink("/proc/self/exe")' app/src/main/java/com/example/dreamlinux/VesselProrootCompatibilityProbe.kt
          ! grep -Fq 'os.access("/proc/self/exe"' app/src/main/java/com/example/dreamlinux/VesselProrootCompatibilityProbe.kt
          grep -F 'VesselProrootCompatibilityProbe.kernelArgv()' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'VesselProrootCompatibilityProbe.sessionBusArgv()' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          ! grep -Fq 'VesselProrootDesktopProfile.PROBE' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          grep -F 'compat-kernel-probe.log' app/src/main/java/com/example/dreamlinux/VmSessionService.kt
          grep -F 'compat-session-dbus.log' app/src/main/java/com/example/dreamlinux/VmSessionService.kt

          bash -n tools/vessel_proroot/fetch_official_proroot.sh
          bash -n tools/vessel_proroot/build_prebuilt_rootfs.sh
          grep -F 'debootstrap' tools/vessel_proroot/build_prebuilt_rootfs.sh
          grep -F 'proroot-production-v1' tools/vessel_proroot/build_prebuilt_rootfs.sh
          grep -F 'install_direct_gpu_mesa.sh "$ROOTFS"' tools/vessel_proroot/build_prebuilt_rootfs.sh
          grep -F 'install_desktop_runtime.sh "$ROOTFS"' tools/vessel_proroot/build_prebuilt_rootfs.sh

          for f in             libproroot.so             libproroot-runtime.so             libproroot-bridge.so             libproroot-linker.so             libproroot-stub-loader.so
          do
            test -s "app/src/main/jniLibs/arm64-v8a/$f"
            grep -F ""**/$f"" app/build.gradle.kts
          done

          # No automatic recovery selection and no app-specific sandbox escape hatch.
          ! grep -R -E 'catch.*Uml|fallback.*UML|fallback.*uml'             app/src/main/java/com/example/dreamlinux/VesselRuntimeFactory.kt             app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          ! grep -R -E -- '--no-sandbox|MOZ_DISABLE_CONTENT_SANDBOX|security\.sandbox\.content\.level'             app/src/main/java/com/example/dreamlinux/VesselProroot*.kt             tools/vessel_proroot


  # Source-only phase commits intentionally do not assemble APKs. A real APK
  # build is explicit via workflow_dispatch once the implementation phases are
  # ready for device validation.
  xwayland-patch:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[manual-apk]')) }}
    runs-on: ubuntu-26.04-arm
    container:
      image: debian:trixie
      options: --user root
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Xwayland build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get build-dep -y xwayland
          apt-get install -y --no-install-recommends git ccache build-essential devscripts fakeroot quilt git-buildpackage pristine-tar python3
      - name: Build Android-seccomp-safe Anland Xwayland
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp
          git clone https://github.com/lfdevs/xwayland.git vessel-xwayland-src
          cd vessel-xwayland-src
          git checkout cec0c8d2a0246bc6107601b4c01101d4b6ffc274
          git config user.email "actions@github.com"
          git config user.name "Vessel CI"
          python3 "$GITHUB_WORKSPACE/tools/vessel_proroot/patch_xwayland_android.py" "$PWD"

          # Keep Debian's 3.0 (quilt) source package clean: turn the Vessel
          # Android compatibility delta into the final quilt patch instead of
          # leaving unexpected upstream modifications for dpkg-source.
          PATCH=debian/patches/0005-vessel-android-seccomp.patch
          git diff -- os/utils.c os/osinit.c Xext/xf86bigfont.c > "$PATCH"
          test -s "$PATCH"
          grep -Fqx '0005-vessel-android-seccomp.patch' debian/patches/series || \
            printf '%s\n' '0005-vessel-android-seccomp.patch' >> debian/patches/series
          git checkout -- os/utils.c os/osinit.c Xext/xf86bigfont.c
          git add "$PATCH" debian/patches/series
          git commit -m "vessel: make Xwayland safe under Android app seccomp"
          origtargz
          gbp buildpackage -uc -us -jauto --git-ignore-branch
          mkdir -p /tmp/vessel-xwayland
          DEB="$(find /tmp -maxdepth 1 -type f -name 'xwayland_*_arm64.deb' -print -quit)"
          test -n "$DEB"
          rm -rf /tmp/xwayland-extract
          dpkg-deb -x "$DEB" /tmp/xwayland-extract
          install -m0755 /tmp/xwayland-extract/usr/bin/Xwayland /tmp/vessel-xwayland/Xwayland.arm64
          sha256sum /tmp/vessel-xwayland/Xwayland.arm64 > /tmp/vessel-xwayland/Xwayland.arm64.sha256
          strings /tmp/vessel-xwayland/Xwayland.arm64 | grep -F 'XWAYLAND_SIGSYS syscall='
      - name: Upload patched Xwayland
        uses: actions/upload-artifact@v4
        with:
          name: vessel-xwayland-arm64
          path: |
            /tmp/vessel-xwayland/Xwayland.arm64
            /tmp/vessel-xwayland/Xwayland.arm64.sha256
          if-no-files-found: error
          retention-days: 14

  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[manual-apk]')) }}
    needs: xwayland-patch
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download patched Xwayland
        uses: actions/download-artifact@v5
        with:
          name: vessel-xwayland-arm64
          path: app/src/main/assets/vessel
      - name: Verify patched Xwayland asset
        shell: bash
        run: |
          set -euxo pipefail
          test -s app/src/main/assets/vessel/Xwayland.arm64
          chmod 0755 app/src/main/assets/vessel/Xwayland.arm64
          strings app/src/main/assets/vessel/Xwayland.arm64 | grep -F 'XWAYLAND_SIGSYS syscall='
      - name: Stage pinned direct KWin overlay
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip zstd
          KWIN_URL="https://github.com/thaakeno/arm-linux/releases/download/vessel-kwin-direct-edge/kwin_vessel-direct_6.3.6-96_arm64.zip"
          KWIN_SHA="8cd81fc9d6d063be92dd9b874413ee2c64a6d536c4066630469455d2324e53a9"
          rm -rf /tmp/vessel-kwin-overlay /tmp/vessel-kwin-debs
          mkdir -p /tmp/vessel-kwin-overlay /tmp/vessel-kwin-debs app/src/main/assets/vessel
          curl --fail --location --retry 4 --connect-timeout 15 -o /tmp/kwin-direct.zip "$KWIN_URL"
          printf '%s  %s\n' "$KWIN_SHA" /tmp/kwin-direct.zip | sha256sum -c -
          unzip -q /tmp/kwin-direct.zip -d /tmp/vessel-kwin-debs
          mapfile -t KWIN_DEBS < <(find /tmp/vessel-kwin-debs -type f -name '*.deb' -print | sort)
          test "${#KWIN_DEBS[@]}" -gt 0
          for deb in "${KWIN_DEBS[@]}"; do
            dpkg-deb -x "$deb" /tmp/vessel-kwin-overlay
          done
          install -d -m0755 /tmp/vessel-kwin-overlay/usr/lib/vessel/desktop
          printf '%s\n' 'vessel-direct-6.3.6-96' > /tmp/vessel-kwin-overlay/usr/lib/vessel/desktop/direct-kwin-build.txt
          tar --hard-dereference --numeric-owner --sort=name --mtime='UTC 2026-01-01'             -C /tmp/vessel-kwin-overlay -cf - .             | zstd -T0 -10 --no-progress -f -o app/src/main/assets/vessel/kwin-direct-overlay.tar.zst
          test -s app/src/main/assets/vessel/kwin-direct-overlay.tar.zst
          zstd -t app/src/main/assets/vessel/kwin-direct-overlay.tar.zst
          zstd -dc app/src/main/assets/vessel/kwin-direct-overlay.tar.zst | tar -tf - > /tmp/kwin-overlay-files.txt
          grep -Fq './usr/lib/vessel/desktop/direct-kwin-build.txt' /tmp/kwin-overlay-files.txt
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Restore immutable Vessel native base
        id: native-base
        uses: actions/cache@v4
        with:
          path: |
            .vessel-native-build
            app/src/main/jniLibs/arm64-v8a
          key: vessel-native-base-v4-${{ runner.os }}-${{ hashFiles('tools/vessel_native/build_runtime_bundle_ci.sh', 'tools/vessel_native/vhost-device-vessel-input/**', 'tools/vessel_native/kernel/**') }}
      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .vessel-native-build/vhost-device-target
          key: vessel-rust-v5-${{ runner.os }}-${{ hashFiles('tools/vessel_native/**/Cargo.lock', 'tools/vessel_native/patch_vhost_gpu_android_ahb.py', 'tools/vessel_native/rebuild_vhost_gpu_ahb.sh') }}
          restore-keys: |
            vessel-rust-v5-${{ runner.os }}-
            vessel-rust-v4-${{ runner.os }}-
      - name: Seed immutable native base from last verified APK
        id: native-seed
        if: steps.native-base.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "seeded=false" >> "$GITHUB_OUTPUT"
          PREV_JSON="$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/workflows/vessel-self-contained.yml/runs?branch=arch%2Fvessel-self-contained&status=success&per_page=1")"
          PREV_RUN="$(jq -r '.workflow_runs[0].id // empty' <<<"$PREV_JSON")"
          PREV_SHA="$(jq -r '.workflow_runs[0].head_sha // empty' <<<"$PREV_JSON")"
          [ -n "$PREV_RUN" ] && [ -n "$PREV_SHA" ] || exit 0
          git cat-file -e "$PREV_SHA^{commit}" 2>/dev/null || exit 0
          BASE_INPUTS=(tools/vessel_native/build_runtime_bundle_ci.sh tools/vessel_native/vhost-device-vessel-input tools/vessel_native/kernel)
          if ! git diff --quiet "$PREV_SHA"..HEAD -- "${BASE_INPUTS[@]}"; then exit 0; fi
          rm -rf /tmp/vessel-prev /tmp/vessel-prev-apk
          mkdir -p /tmp/vessel-prev /tmp/vessel-prev-apk app/src/main/jniLibs/arm64-v8a app/src/main/assets/vessel
          if ! gh run download "$PREV_RUN" -n vessel-self-contained-arm64 -D /tmp/vessel-prev; then gh run download "$PREV_RUN" -n vessel-protocol39-self-contained-arm64 -D /tmp/vessel-prev; fi
          PREV_APK="$(find /tmp/vessel-prev -name '*.apk' -print -quit)"
          [ -n "$PREV_APK" ] || exit 0
          unzip -q "$PREV_APK" 'lib/arm64-v8a/*' 'assets/vessel/runtime-build.txt' -d /tmp/vessel-prev-apk
          for f in libvessel_uml.so libvessel_stub.so libvessel_umnet.so libvessel_passt.so libvessel_vhost_input.so libvessel_virglrenderer.so libvessel_epoxy.so libEGL_angle.so libGLESv1_CM_angle.so libGLESv2_angle.so; do
            [ ! -s "/tmp/vessel-prev-apk/lib/arm64-v8a/$f" ] || cp "/tmp/vessel-prev-apk/lib/arm64-v8a/$f" "app/src/main/jniLibs/arm64-v8a/$f"
          done
          cp /tmp/vessel-prev-apk/assets/vessel/runtime-build.txt app/src/main/assets/vessel/runtime-build.txt
          chmod 0755 app/src/main/jniLibs/arm64-v8a/libvessel_uml.so app/src/main/jniLibs/arm64-v8a/libvessel_stub.so app/src/main/jniLibs/arm64-v8a/libvessel_umnet.so app/src/main/jniLibs/arm64-v8a/libvessel_passt.so app/src/main/jniLibs/arm64-v8a/libvessel_vhost_input.so
          echo "seeded=true" >> "$GITHUB_OUTPUT"
      - name: Install Android NDK and host build tools
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sudo apt-get update
          if [ "${{ steps.native-base.outputs.cache-hit }}" = "true" ] || [ "${{ steps.native-seed.outputs.seeded }}" = "true" ]; then sudo apt-get install -y --no-install-recommends patchelf libclang-dev pkg-config file unzip; else sudo apt-get install -y --no-install-recommends patchelf xz-utils libclang-dev clang pkg-config cmake ninja-build file unzip curl git python3 build-essential flex bison bc rsync cpio libssl-dev libelf-dev dwarves zip; fi
          rustup target add aarch64-linux-android
      - name: Build and package native runtime
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x tools/vessel_native/build_runtime_bundle_ci.sh tools/vessel_native/prepare_gpu_rebuild_ci.sh tools/vessel_native/rebuild_vhost_gpu_ahb.sh
          if [ "${{ steps.native-base.outputs.cache-hit }}" != "true" ] && [ "${{ steps.native-seed.outputs.seeded }}" != "true" ]; then tools/vessel_native/build_runtime_bundle_ci.sh; else tools/vessel_native/prepare_gpu_rebuild_ci.sh; fi
          tools/vessel_native/rebuild_vhost_gpu_ahb.sh
      - name: Verify authoritative source architecture
        shell: bash
        run: |
          set -euxo pipefail
          grep -F 'versionName = "2.2.10"' app/build.gradle.kts
          test -s app/signing/vessel-ci-debug.keystore
          grep -F 'VesselBootstrapActivityV2' app/src/main/AndroidManifest.xml
          grep -F 'github-release-chunks-v1' app/src/main/java/com/example/dreamlinux/VesselBootstrapActivityV2.kt
          grep -F 'Workstation manifest is not the new chunked format yet' app/src/main/java/com/example/dreamlinux/VesselBootstrapActivityV2.kt
          grep -F 'SequenceInputStream' app/src/main/java/com/example/dreamlinux/VesselBootstrapActivityV2.kt
          grep -F 'Nothing installs automatically' app/src/main/java/com/example/dreamlinux/VesselBootstrapActivityV2.kt
          grep -F 'softwareFallback", false' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'selectedVcpus' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'ensureGuestNetworkBlocking' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'org.freedesktop.packagekit.' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'gfx.webrender.compositor", false' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          ! grep -Fq 'gfx.webrender.compositor.force-enabled' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'virtio-input-ready-async' app/src/main/cpp/vessel_virtio_input.cpp
          grep -F 'SOCK_NONBLOCK' app/src/main/cpp/vessel_virtio_input.cpp
          ! grep -Fq 'predictedCursorX' app/src/main/java/com/example/dreamlinux/LinuxDesktopView.kt
          grep -F 'partialCopies=' tools/vessel_native/vessel_ahb_bridge.cpp
          grep -F 'FRAME_SLOTS = 3' tools/vessel_native/vessel_ahb_bridge.cpp
          grep -F 'resource_changed' tools/vessel_native/vessel_ahb_bridge.cpp
          ! grep -Fq 'MOZ_DISABLE_CONTENT_SANDBOX=1' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          ! grep -Fq 'security.sandbox.content.level", 0' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'source_resource_id' tools/vessel_native/vessel_ahb_bridge.cpp
          grep -F 'state.resource_id == resource_id' tools/vessel_native/vessel_ahb_bridge.cpp
          grep -F 'VESSEL_ANDROID_AHB_SCANOUT_V3' tools/vessel_native/patch_vhost_gpu_android_ahb.py
          ! find tools/vessel_native -maxdepth 1 -name 'alpha*.py' -print -quit | grep -q .
          ! grep -Eq 'alpha[0-9]+_' tools/vessel_native/rebuild_vhost_gpu_ahb.sh
          grep -Fq 'VESSEL_TERMUX_PTY_NDK29_DIRECT_SOURCE_V1' app/src/main/cpp/third_party/termux/vessel_termux_pty.c
          ! find app/src/main/cpp/third_party/termux -type f -name '*patch*' -print -quit | grep -q .
          grep -F 'CONFIG_VIRTIO_INPUT=y' tools/vessel_native/kernel/build_uml_smp_android.sh
          grep -F 'damage_updates=enabled' app/src/main/assets/vessel/runtime-build.txt
          grep -F 'AHardwareBuffer_sendHandleToUnixSocket' tools/vessel_native/vessel_ahb_bridge.cpp
          grep -F 'eglDupNativeFenceFDANDROID' tools/vessel_native/vessel_ahb_bridge.cpp
          ! grep -Eq '\bglFinish[[:space:]]*\(' tools/vessel_native/vessel_ahb_bridge.cpp
          test -x app/src/main/jniLibs/arm64-v8a/libvessel_uml.so
          test -x app/src/main/jniLibs/arm64-v8a/libvessel_vhost_gpu.so
          test -x app/src/main/jniLibs/arm64-v8a/libvessel_vhost_input.so
      - name: Build, test, lint and R8 release
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --no-daemon --build-cache
      - name: Verify APK payloads
        shell: bash
        run: |
          set -euxo pipefail
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$DEBUG_APK"; test -s "$RELEASE_APK"
          unzip -l "$DEBUG_APK" > /tmp/apk-files.txt
          unzip -l "$RELEASE_APK" > /tmp/release-apk-files.txt
          for f in libtermux.so libproroot.so libproroot-runtime.so libproroot-bridge.so libproroot-linker.so libproroot-stub-loader.so libvessel_uml.so libvessel_stub.so libvessel_umnet.so libvessel_passt.so libvessel_vhost_gpu.so libvessel_vhost_input.so libvessel_virglrenderer.so libvessel_epoxy.so libEGL_angle.so libGLESv2_angle.so libvessel_wayland_presenter.so; do grep -Fq "lib/arm64-v8a/$f" /tmp/apk-files.txt; grep -Fq "lib/arm64-v8a/$f" /tmp/release-apk-files.txt; done

          verify_proroot_apk() {
            local apk="$1" suffix="$2"
            declare -A expected=(
              [libproroot.so]=a4e74d75b66cdc02b080adfe863dbf9951c3b30610d77beddc95488d5fe5de01
              [libproroot-runtime.so]=8c47a0a7db32d84c179ebb5bf3640f655a3181860ece5886ae44d92858730c34
              [libproroot-bridge.so]=1c5bc9537a270e8bf8b1c70222813f57b60b828bfb5503ddf8fe37685092de2f
              [libproroot-linker.so]=51a0ec5bfed00e572a0de09e22d9057e2befc386b78e426613d3e0ab03f4ecee
              [libproroot-stub-loader.so]=06c6624db3bdc45b9ced151cd781df439a37b47731d244b93e9d6a58cd48cde0
            )
            for f in "${!expected[@]}"; do
              out="/tmp/${f}.${suffix}"
              unzip -p "$apk" "lib/arm64-v8a/$f" > "$out"
              actual="$(sha256sum "$out" | awk '{print $1}')"
              [ "$actual" = "${expected[$f]}" ]
            done
          }
          verify_proroot_apk "$DEBUG_APK" debug
          verify_proroot_apk "$RELEASE_APK" release
          unzip -p "$DEBUG_APK" lib/arm64-v8a/libtermux.so > /tmp/libtermux-debug.so
          unzip -p "$RELEASE_APK" lib/arm64-v8a/libtermux.so > /tmp/libtermux-release.so
          strings /tmp/libtermux-debug.so | grep -Fq 'VESSEL_TERMUX_PTY_NDK29_DIRECT_SOURCE_V1'
          strings /tmp/libtermux-release.so | grep -Fq 'VESSEL_TERMUX_PTY_NDK29_DIRECT_SOURCE_V1'
          grep -Eq 'lib/arm64-v8a/libzstd-jni.*\.so' /tmp/apk-files.txt
          grep -Eq 'lib/arm64-v8a/libzstd-jni.*\.so' /tmp/release-apk-files.txt
          grep -Fq 'assets/vessel/Xwayland.arm64' /tmp/apk-files.txt
          grep -Fq 'assets/vessel/Xwayland.arm64' /tmp/release-apk-files.txt
          grep -Fq 'assets/vessel/kwin-direct-overlay.tar.zst' /tmp/apk-files.txt
          grep -Fq 'assets/vessel/kwin-direct-overlay.tar.zst' /tmp/release-apk-files.txt
          grep -Fq 'assets/vessel/vessel-start-plasma' /tmp/apk-files.txt
          grep -Fq 'assets/vessel/vessel-start-plasma' /tmp/release-apk-files.txt
          grep -Fq 'proroot-production-v16' app/src/main/java/com/example/dreamlinux/VesselProrootRuntimeBackend.kt
          ! grep -Eq 'debian-docker\.ext4|rootfs\.img' /tmp/apk-files.txt
          ! grep -Eq 'debian-docker\.ext4|rootfs\.img' /tmp/release-apk-files.txt
          mkdir -p build/deliverables
          cp "$DEBUG_APK" build/deliverables/Vessel-arm64-debug.apk
          cp "$RELEASE_APK" build/deliverables/Vessel-arm64-release-unsigned.apk
          sha256sum build/deliverables/*.apk > build/deliverables/SHA256SUMS.txt
      - name: Verify public production proroot rootfs target
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/vessel-proroot-rootfs-v1-edge/Vessel-Proroot-trixie-arm64.json"
          READY=0
          for i in $(seq 1 200); do
            JSON="$(curl -fsSL --connect-timeout 10 --max-time 30 "${MANIFEST_URL}?apk=${GITHUB_SHA}" 2>/dev/null || true)"
            SCHEMA="$(jq -r '.schema // 0' <<<"$JSON" 2>/dev/null || true)"
            RUNTIME="$(jq -r '.runtime // empty' <<<"$JSON" 2>/dev/null || true)"
            DEBIAN="$(jq -r '.debian // empty' <<<"$JSON" 2>/dev/null || true)"
            TRANSPORT="$(jq -r '.transport // empty' <<<"$JSON" 2>/dev/null || true)"
            DESKTOP="$(jq -r '.desktopRelease // empty' <<<"$JSON" 2>/dev/null || true)"
            SHA="$(jq -r '.archiveSha256 // empty' <<<"$JSON" 2>/dev/null || true)"
            TOTAL="$(jq -r '.archiveBytes // 0' <<<"$JSON" 2>/dev/null || echo 0)"
            COUNT="$(jq -r '.chunks | length' <<<"$JSON" 2>/dev/null || echo 0)"
            SUM="$(jq -r '[.chunks[]?.bytes] | add // 0' <<<"$JSON" 2>/dev/null || echo 0)"
            FIRST="$(jq -r '.chunks[0].url // empty' <<<"$JSON" 2>/dev/null || true)"
            LAST="$(jq -r '.chunks[-1].url // empty' <<<"$JSON" 2>/dev/null || true)"
            if [ "$SCHEMA" = 2 ] && [ "$RUNTIME" = proroot ] && [ "$DEBIAN" = trixie ] &&                [ "$TRANSPORT" = github-release-chunks-v1 ] && [ "$DESKTOP" = vessel-direct-6.3.6-96 ] && [ ${#SHA} -eq 64 ] &&                [ "$COUNT" -gt 0 ] && [ "$TOTAL" = "$SUM" ]; then
              if curl -fsSIL --connect-timeout 10 --max-time 30 "$FIRST" >/dev/null 2>&1 &&                  curl -fsSIL --connect-timeout 10 --max-time 30 "$LAST" >/dev/null 2>&1; then
                READY=1
                echo "production proroot rootfs is publicly readable: $COUNT parts, $TOTAL bytes"
                break
              fi
            fi
            echo "waiting for production proroot rootfs publication ($i/200)"
            sleep 3
          done
          [ "$READY" = 1 ]

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: vessel-self-contained-arm64
          path: |
            build/deliverables/Vessel-arm64-debug.apk
            build/deliverables/Vessel-arm64-release-unsigned.apk
            build/deliverables/SHA256SUMS.txt
            app/src/main/assets/vessel/runtime-build.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling Vessel app update
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/arch/vessel-self-contained' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          APK=build/deliverables/Vessel-arm64-debug.apk
          EDGE_APK=build/deliverables/Vessel-edge-arm64.apk
          META=build/deliverables/vessel-edge.json
          cp "$APK" "$EDGE_APK"
          SHA="$(sha256sum "$EDGE_APK" | awk '{print $1}')"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          REVISION_COUNT="$(git rev-list --count HEAD)"
          VERSION_CODE="$((4000 + REVISION_COUNT))"
          test -n "$VERSION_NAME"
          test "${#SHA}" -eq 64
          jq -n             --arg versionName "$VERSION_NAME"             --arg sha256 "$SHA"             --arg commit "$GITHUB_SHA"             --argjson versionCode "$VERSION_CODE"             '{versionCode:$versionCode,versionName:$versionName,sha256:$sha256,commit:$commit}'             > "$META"

          if gh release view vessel-edge >/dev/null 2>&1; then
            gh release upload vessel-edge "$EDGE_APK" "$META" --clobber
          else
            gh release create vessel-edge               --target "$GITHUB_SHA"               --title "Vessel Edge"               --notes "Rolling verified Vessel Android build."               --prerelease               "$EDGE_APK" "$META"
          fi

