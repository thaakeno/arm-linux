name: Vessel self-contained protocol 39 APK

on:
  push:
    branches: [ arch/vessel-self-contained ]
    paths:
      - 'app/**'
      - 'tools/vessel_native/**'
      - 'tools/venus_poc/build_uml_smp_android.sh'
      - 'tools/venus_poc/apply_umshm.py'
      - 'tools/venus_poc/fix_umshm_nonblock.py'
      - 'tools/venus_poc/fix_umshm_ptrace_fds.py'
      - 'tools/venus_poc/patch_virtio_uml_vhost_gpu.py'
      - '.github/workflows/vessel-self-contained.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

concurrency:
  group: vessel-self-contained-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Restore immutable Vessel native base
        id: native-base
        uses: actions/cache@v4
        with:
          path: |
            .vessel-native-build
            app/src/main/jniLibs/arm64-v8a
          key: vessel-native-base-v3-${{ runner.os }}-${{ hashFiles('tools/vessel_native/build_runtime_bundle_ci.sh', 'tools/vessel_native/vhost-device-vessel-input/**', 'tools/venus_poc/build_uml_smp_android.sh', 'tools/venus_poc/apply_umshm.py', 'tools/venus_poc/fix_umshm_nonblock.py', 'tools/venus_poc/fix_umshm_ptrace_fds.py', 'tools/venus_poc/patch_virtio_uml_vhost_gpu.py') }}

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .vessel-native-build/vhost-device-target
          key: vessel-rust-v2-${{ runner.os }}-${{ hashFiles('tools/vessel_native/**/Cargo.lock', 'tools/vessel_native/patch_vhost_gpu_android_ahb.py', 'tools/vessel_native/rebuild_vhost_gpu_ahb.sh') }}
          restore-keys: |
            vessel-rust-v2-${{ runner.os }}-

      - name: Seed native base from last verified APK
        id: native-seed
        if: steps.native-base.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "seeded=false" >> "$GITHUB_OUTPUT"
          PREV_JSON="$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/workflows/vessel-self-contained.yml/runs?branch=arch%2Fvessel-self-contained&status=success&per_page=1")"
          PREV_RUN="$(jq -r '.workflow_runs[0].id // empty' <<<"$PREV_JSON")"
          PREV_SHA="$(jq -r '.workflow_runs[0].head_sha // empty' <<<"$PREV_JSON")"
          [ -n "$PREV_RUN" ] && [ -n "$PREV_SHA" ] || exit 0
          git cat-file -e "$PREV_SHA^{commit}" 2>/dev/null || exit 0

          BASE_INPUTS=(
            tools/vessel_native/build_runtime_bundle_ci.sh
            tools/vessel_native/vhost-device-vessel-input
            tools/venus_poc/build_uml_smp_android.sh
            tools/venus_poc/apply_umshm.py
            tools/venus_poc/fix_umshm_nonblock.py
            tools/venus_poc/fix_umshm_ptrace_fds.py
            tools/venus_poc/patch_virtio_uml_vhost_gpu.py
          )
          if ! git diff --quiet "$PREV_SHA"..HEAD -- "${BASE_INPUTS[@]}"; then
            echo "Expensive native base inputs changed; refusing to seed from an older APK."
            exit 0
          fi

          rm -rf /tmp/vessel-prev /tmp/vessel-prev-apk
          mkdir -p /tmp/vessel-prev /tmp/vessel-prev-apk app/src/main/jniLibs/arm64-v8a app/src/main/assets/vessel
          gh run download "$PREV_RUN" -n vessel-protocol39-self-contained-arm64 -D /tmp/vessel-prev
          PREV_APK="$(find /tmp/vessel-prev -name '*.apk' -print -quit)"
          [ -n "$PREV_APK" ] || exit 0
          unzip -q "$PREV_APK" 'lib/arm64-v8a/*' 'assets/vessel/runtime-build.txt' -d /tmp/vessel-prev-apk
          for f in \
            libvessel_uml.so libvessel_stub.so libvessel_umnet.so libvessel_passt.so \
            libvessel_vhost_input.so libvessel_virglrenderer.so libvessel_epoxy.so \
            libEGL_angle.so libGLESv1_CM_angle.so libGLESv2_angle.so; do
            if [ -s "/tmp/vessel-prev-apk/lib/arm64-v8a/$f" ]; then
              cp "/tmp/vessel-prev-apk/lib/arm64-v8a/$f" "app/src/main/jniLibs/arm64-v8a/$f"
            fi
          done
          cp /tmp/vessel-prev-apk/assets/vessel/runtime-build.txt app/src/main/assets/vessel/runtime-build.txt
          chmod 0755 \
            app/src/main/jniLibs/arm64-v8a/libvessel_uml.so \
            app/src/main/jniLibs/arm64-v8a/libvessel_stub.so \
            app/src/main/jniLibs/arm64-v8a/libvessel_umnet.so \
            app/src/main/jniLibs/arm64-v8a/libvessel_passt.so \
            app/src/main/jniLibs/arm64-v8a/libvessel_vhost_input.so
          test -s app/src/main/jniLibs/arm64-v8a/libvessel_uml.so
          test -s app/src/main/jniLibs/arm64-v8a/libvessel_virglrenderer.so
          test -s app/src/main/jniLibs/arm64-v8a/libvessel_epoxy.so
          test -s app/src/main/assets/vessel/runtime-build.txt
          echo "seeded=true" >> "$GITHUB_OUTPUT"
          echo "Seeded unchanged expensive runtime from verified run $PREV_RUN ($PREV_SHA)."

      - name: Install Android NDK and host build tools
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sudo apt-get update
          if [ "${{ steps.native-base.outputs.cache-hit }}" = "true" ] || [ "${{ steps.native-seed.outputs.seeded }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends patchelf libclang-dev pkg-config file unzip
          else
            sudo apt-get install -y --no-install-recommends \
              patchelf xz-utils libclang-dev clang pkg-config cmake ninja-build file unzip curl git python3 \
              build-essential flex bison bc rsync cpio libssl-dev libelf-dev dwarves zip
          fi
          rustup target add aarch64-linux-android

      - name: Build and package Vessel native runtime
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x \
            tools/vessel_native/build_runtime_bundle_ci.sh \
            tools/vessel_native/prepare_gpu_rebuild_ci.sh \
            tools/vessel_native/rebuild_vhost_gpu_ahb.sh

          if [ "${{ steps.native-base.outputs.cache-hit }}" != "true" ] && [ "${{ steps.native-seed.outputs.seeded }}" != "true" ]; then
            echo "No valid native base available; performing the full deterministic runtime build."
            tools/vessel_native/build_runtime_bundle_ci.sh
          else
            echo "Reusing verified immutable kernel/input/ANGLE/VirGL base."
            tools/vessel_native/prepare_gpu_rebuild_ci.sh
          fi

          # GPU bridge/vhost are always rebuilt from the current commit. Native
          # source changes therefore cannot be hidden by the base cache.
          tools/vessel_native/rebuild_vhost_gpu_ahb.sh

      - name: Verify production architecture and native ABI
        shell: bash
        run: |
          set -euxo pipefail
          grep -Eq 'const val REVISION = "v39-self-contained-dmabuf-virtio-input-r[0-9]+"' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'vhost-user-gpu-dmabuf-same-uid-v1' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'virtio-input-vhost-user-same-uid-v1' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'softwareFallback", false' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'VIRTIO_INPUT_ID = 18' app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt
          grep -F 'CONFIG_VIRTIO_INPUT=y' tools/venus_poc/build_uml_smp_android.sh
          grep -F 'display_bridge=android-hardware-buffer-zero-copy-v1' app/src/main/assets/vessel/runtime-build.txt
          grep -F 'runtime=v39-self-contained-ahb-virtio-input-r4' app/src/main/assets/vessel/runtime-build.txt
          grep -F 'nativeAhbAttachSurface' app/src/main/java/com/example/dreamlinux/VesselWaylandPresenter.kt
          grep -F 'AHardwareBuffer_sendHandleToUnixSocket' tools/vessel_native/vessel_ahb_bridge.cpp
          grep -F 'extern "C" {' tools/vessel_native/vessel_ahb_bridge.cpp
          grep -F 'VesselHostDebug' app/src/main/java/com/example/dreamlinux/VesselActivity.kt
          ! test -e app/src/main/assets/vessel/guest_input_agent.py
          ! grep -R -E 'VesselFrameTcpBridge|47635|47633|guest_input_agent|TermuxUmlController|com\.termux\.permission\.RUN_COMMAND' \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/example/dreamlinux/VesselRuntimeController.kt \
            app/src/main/java/com/example/dreamlinux/VesselWaylandPresenter.kt \
            app/src/main/java/com/example/dreamlinux/VesselVirtioInput.kt \
            app/src/main/cpp/vessel_native_presenter.cpp \
            app/src/main/cpp/vessel_ahb_presenter.cpp \
            app/src/main/cpp/vessel_virtio_input.cpp
          test -x app/src/main/jniLibs/arm64-v8a/libvessel_uml.so
          test -x app/src/main/jniLibs/arm64-v8a/libvessel_vhost_gpu.so
          test -x app/src/main/jniLibs/arm64-v8a/libvessel_vhost_input.so
          test -s app/src/main/jniLibs/arm64-v8a/libvessel_ahb_bridge.so
          test -s app/src/main/jniLibs/arm64-v8a/libvessel_virglrenderer.so
          test -s app/src/main/jniLibs/arm64-v8a/libvessel_epoxy.so
          test -s app/src/main/jniLibs/arm64-v8a/libEGL_angle.so
          test -s app/src/main/jniLibs/arm64-v8a/libGLESv2_angle.so
          patchelf --print-needed app/src/main/jniLibs/arm64-v8a/libvessel_vhost_gpu.so | grep -Fq libvessel_ahb_bridge.so
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D --undefined-only app/src/main/jniLibs/arm64-v8a/libvessel_ahb_bridge.so | grep -Fq virgl_renderer_resource_get_info
          ! "$NM" -D --undefined-only app/src/main/jniLibs/arm64-v8a/libvessel_ahb_bridge.so | grep -Fq _Z32virgl_renderer_resource_get_info
          "$NM" -D app/src/main/jniLibs/arm64-v8a/libvessel_virglrenderer.so | grep -Fq virgl_renderer_resource_get_info

      - name: Build, test and lint APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --build-cache

      - name: Verify APK contains complete runtime but no distro image
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | tee /tmp/apk-files.txt
          for f in \
            libvessel_uml.so libvessel_stub.so libvessel_umnet.so libvessel_passt.so \
            libvessel_vhost_gpu.so libvessel_vhost_input.so libvessel_ahb_bridge.so \
            libvessel_virglrenderer.so libvessel_epoxy.so \
            libEGL_angle.so libGLESv2_angle.so libvessel_wayland_presenter.so; do
            grep -Fq "lib/arm64-v8a/$f" /tmp/apk-files.txt || { echo "APK missing $f" >&2; exit 1; }
          done
          ! grep -Eq 'debian-docker\.ext4|rootfs\.img' /tmp/apk-files.txt
          mkdir -p build/deliverables
          cp "$APK" build/deliverables/Vessel-protocol39-self-contained-arm64.apk
          sha256sum build/deliverables/Vessel-protocol39-self-contained-arm64.apk | tee build/deliverables/SHA256SUMS.txt

      - name: Upload finished Vessel APK
        uses: actions/upload-artifact@v4
        with:
          name: vessel-protocol39-self-contained-arm64
          path: |
            build/deliverables/Vessel-protocol39-self-contained-arm64.apk
            build/deliverables/SHA256SUMS.txt
            app/src/main/assets/vessel/runtime-build.txt
          if-no-files-found: error
          retention-days: 14
