name: Vessel Workstation Image

on:
  workflow_dispatch:
  push:
    branches: [ arch/vessel-self-contained ]
    paths:
      - 'tools/vessel_workstation/**'
      - '.github/workflows/vessel-workstation-image.yml'
      - 'app/src/main/java/com/example/dreamlinux/VesselBootstrapActivity.kt'

concurrency:
  group: vessel-workstation-image-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install workstation image tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl zstd e2fsprogs util-linux jq
      - name: Build complete ARM64 Plasma workstation image
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x tools/vessel_workstation/build_prebuilt_workstation.sh
          tools/vessel_workstation/build_prebuilt_workstation.sh build/workstation
      - name: Verify workstation assets
        shell: bash
        run: |
          set -euxo pipefail
          test -s build/workstation/Vessel-Workstation-bookworm-arm64.ext4.zst
          test -s build/workstation/Vessel-Workstation-bookworm-arm64.json
          python3 - <<'PY'
          import json
          p='build/workstation/Vessel-Workstation-bookworm-arm64.json'
          x=json.load(open(p))
          assert x['schema']==1
          assert x['arch']=='arm64'
          assert x['compression']=='zstd'
          assert x['recommends'] is True
          assert x['compressedBytes'] < 2_000_000_000
          assert len(x['compressedSha256'])==64
          assert len(x['imageSha256'])==64
          PY
      - name: Publish image atomically, manifest last
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        shell: bash
        run: |
          set -euo pipefail
          TAG=vessel-workstation-v2-edge
          BASE=build/workstation/Vessel-Workstation-bookworm-arm64
          MANIFEST="$BASE.json"
          SOURCE_ARCHIVE="$BASE.ext4.zst"
          ASSET_NAME="Vessel-Workstation-bookworm-arm64-${GITHUB_SHA}.ext4.zst"
          # Keep the staged archive in the same directory and RENAME it. The old
          # workflow copied this multi-GB file to /tmp right when the runner was
          # tightest on disk space, which could kill an otherwise valid build.
          STAGED_ARCHIVE="build/workstation/$ASSET_NAME"
          PUBLIC_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET_NAME"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Vessel Workstation v2 Edge' \
              --notes 'Atomic rolling prebuilt Debian Bookworm ARM64 + KDE Plasma workstation for Vessel.'
          fi

          mv "$SOURCE_ARCHIVE" "$STAGED_ARCHIVE"
          EXPECTED_BYTES="$(stat -c '%s' "$STAGED_ARCHIVE")"
          echo "publishing $ASSET_NAME ($EXPECTED_BYTES bytes)"
          df -h .

          # A cancelled/failed previous attempt can leave an asset with the same
          # name in a transient state. Remove it before retrying the upload.
          delete_asset_if_present() {
            local id
            id="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .id" | head -1 || true)"
            if [ -n "$id" ]; then
              gh api -X DELETE "/repos/$GITHUB_REPOSITORY/releases/assets/$id" || true
            fi
          }
          delete_asset_if_present

          UPLOADED=0
          for attempt in 1 2 3 4 5; do
            echo "release upload attempt $attempt/5"
            if gh release upload "$TAG" "$STAGED_ARCHIVE" --repo "$GITHUB_REPOSITORY"; then
              UPLOADED=1
              break
            fi
            delete_asset_if_present
            sleep $((attempt * 8))
          done
          [ "$UPLOADED" = 1 ]

          READY=0
          for i in $(seq 1 180); do
            ASSET_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
            STATE="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .state // empty' <<<"$ASSET_JSON")"
            SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .size // 0' <<<"$ASSET_JSON")"
            if [ "$STATE" = uploaded ] && [ "$SIZE" = "$EXPECTED_BYTES" ]; then
              READY=1
              break
            fi
            echo "waiting for GitHub release asset: state=${STATE:-missing} size=${SIZE:-0}/$EXPECTED_BYTES"
            sleep 5
          done
          [ "$READY" = 1 ]

          # The GitHub API is the authoritative readiness check above. Public
          # download URLs can lag very briefly behind the API, so retry without
          # rebuilding the image.
          PUBLIC_READY=0
          for i in $(seq 1 30); do
            if curl -fsSIL --connect-timeout 15 --max-time 45 "$PUBLIC_URL" >/dev/null; then
              PUBLIC_READY=1
              break
            fi
            echo "waiting for public release CDN ($i/30)"
            sleep 4
          done
          [ "$PUBLIC_READY" = 1 ]

          python3 - "$MANIFEST" "$PUBLIC_URL" "$GITHUB_SHA" <<'PY'
          import json, sys
          path, url, revision = sys.argv[1:]
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          data['revision'] = revision
          data['url'] = url
          data['assetName'] = url.rsplit('/', 1)[-1]
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, sort_keys=True)
              f.write('\n')
          PY

          # Publish the tiny pointer only after the large immutable image is
          # known-good. Clients can therefore never discover a half-uploaded image.
          gh release upload "$TAG" "$MANIFEST" --clobber --repo "$GITHUB_REPOSITORY"

          PUBLISHED_OK=0
          for i in $(seq 1 40); do
            PUBLISHED="$(curl -fsSL --connect-timeout 15 --max-time 45 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Vessel-Workstation-bookworm-arm64.json" 2>/dev/null || true)"
            REV="$(jq -r '.revision // empty' <<<"$PUBLISHED" 2>/dev/null || true)"
            URL="$(jq -r '.url // empty' <<<"$PUBLISHED" 2>/dev/null || true)"
            if [ "$REV" = "$GITHUB_SHA" ] && [ "$URL" = "$PUBLIC_URL" ]; then
              PUBLISHED_OK=1
              break
            fi
            echo "waiting for manifest CDN ($i/40) revision=${REV:-missing}"
            sleep 3
          done
          [ "$PUBLISHED_OK" = 1 ]

          # Clean old immutable image assets only after the new manifest is live.
          RELEASE_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          jq -r --arg keep "$ASSET_NAME" '.assets[] | select(.name | startswith("Vessel-Workstation-bookworm-arm64-")) | select(.name != $keep) | .id' <<<"$RELEASE_JSON" | while read -r old_id; do
            [ -n "$old_id" ] && gh api -X DELETE "/repos/$GITHUB_REPOSITORY/releases/assets/$old_id" || true
          done

          echo "published workstation revision $GITHUB_SHA"
