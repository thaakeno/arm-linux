name: Vessel Weston desktop APK

on:
  push:
    branches: [ arch/vessel-wlroots-final ]
  workflow_dispatch:

concurrency:
  group: vessel-weston-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-wayland-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify protocol 35 Weston architecture
        run: |
          set -euxo pipefail
          grep -F 'PROTOCOL_VERSION = 35' tools/venus_poc/vessel_runtime_daemon_v35.py
          grep -F 'weston-nested-vessel-transport-venus-android-surface-v1' tools/venus_poc/vessel_runtime_daemon_v35.py
          grep -F 'Weston/libweston desktop-shell' tools/venus_poc/vessel_runtime_daemon_v35.py
          grep -F -- '--backend=wayland-backend.so' tools/venus_poc/vessel_runtime_daemon_v35.py
          grep -F -- '--xwayland' tools/venus_poc/vessel_runtime_daemon_v35.py
          grep -F 'repaint-window=7' tools/venus_poc/vessel_runtime_daemon_v35.py
          grep -F 'VESSEL_TRANSPORT_CACHE_HIT' tools/venus_poc/vessel_runtime_daemon_v35.py
          ! grep -E 'seatd-launch|WLR_BACKENDS|WLR_RENDERER|sway --|kwin_wayland|Xtigervnc|vncserver|screenshot' tools/venus_poc/vessel_runtime_daemon_v35.py
          grep -F 'wl_seat_interface,7' tools/venus_poc/vessel_wayland_bridge/vessel_transport_host.c
          grep -F 'wp_presentation_interface' tools/venus_poc/vessel_wayland_bridge/vessel_transport_host.c
          grep -F 'zwp_linux_dmabuf_v1_send_modifier' tools/venus_poc/vessel_wayland_bridge/vessel_transport_host.c
          grep -F 'shm-damage' tools/venus_poc/vessel_wayland_bridge/vessel_transport_host.c
          grep -F 'SOCK_SEQPACKET' tools/venus_poc/guest_input_direct_v34.py
          grep -F 'FRAME_SHM_G2H = 12' tools/venus_poc/guest_relay_wayland.py
          grep -F 'FRAME_SHM_G2H = 12' tools/venus_poc/host_relay_wayland.py
          grep -F 'vessel_wayland_presenter_v3.cpp' app/src/main/cpp/CMakeLists.txt

      - name: Syntax-check runtime and relay code
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            tools/venus_poc/vessel_runtime_daemon_v31.py \
            tools/venus_poc/vessel_runtime_daemon_v33.py \
            tools/venus_poc/vessel_runtime_daemon_v34.py \
            tools/venus_poc/vessel_runtime_daemon_v35.py \
            tools/venus_poc/guest_command_agent_v33.py \
            tools/venus_poc/guest_input_direct_v34.py \
            tools/venus_poc/guest_relay_wayland.py \
            tools/venus_poc/host_relay_wayland.py \
            tools/venus_poc/host_input_bridge.py
          bash -n tools/venus_poc/run_venus_wayland.sh

      - name: Compile transport and run nested Weston + Foot smoke test
        run: |
          set -euxo pipefail
          docker run --rm -v "$PWD:/src:ro" -w /src debian:12-slim bash -lc '
            set -euxo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential pkg-config libwayland-dev wayland-protocols libxkbcommon-dev \
              weston foot xwayland dbus-x11 python3

            rm -rf /tmp/vessel-transport-build /tmp/vessel-runtime /tmp/vessel-frame-test.sock
            mkdir -p /tmp/vessel-transport-build /tmp/vessel-runtime
            chmod 700 /tmp/vessel-runtime
            cd /tmp/vessel-transport-build
            wayland-scanner server-header /usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml xdg-shell-server-protocol.h
            wayland-scanner private-code /usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml xdg-shell-protocol.c
            wayland-scanner server-header /usr/share/wayland-protocols/unstable/linux-dmabuf/linux-dmabuf-unstable-v1.xml linux-dmabuf-unstable-v1-server-protocol.h
            wayland-scanner private-code /usr/share/wayland-protocols/unstable/linux-dmabuf/linux-dmabuf-unstable-v1.xml linux-dmabuf-unstable-v1-protocol.c
            wayland-scanner server-header /usr/share/wayland-protocols/stable/presentation-time/presentation-time.xml presentation-time-server-protocol.h
            wayland-scanner private-code /usr/share/wayland-protocols/stable/presentation-time/presentation-time.xml presentation-time-protocol.c
            cc -O2 -std=gnu11 -Wall -Wextra -Werror=implicit-function-declaration \
              -I/tmp/vessel-transport-build \
              /src/tools/venus_poc/vessel_wayland_bridge/vessel_transport_host.c \
              xdg-shell-protocol.c linux-dmabuf-unstable-v1-protocol.c presentation-time-protocol.c \
              $(pkg-config --cflags --libs wayland-server xkbcommon) -o /tmp/vessel-transport-host
            test -x /tmp/vessel-transport-host

            python3 -c "import os,socket,struct; p=\"/tmp/vessel-frame-test.sock\"; os.path.exists(p) and os.unlink(p); s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.bind(p); s.listen(1); c,_=s.accept(); h=struct.Struct(\"<IIIIIIIIQQ\"); raw=c.recv(h.size,socket.MSG_WAITALL); f=h.unpack(raw); assert f[0]==0x31574656; n=f[5]*(f[8]>>32) if f[1]==4 else 0; data=b\"\"; exec(\"while len(data)<n:\\n data+=c.recv(min(65536,n-len(data)))\"); print(\"FRAME_OK\",f[1],f[2],f[3],n,flush=True)" >/tmp/frame-listener.log 2>&1 &
            LISTENER=$!

            export XDG_RUNTIME_DIR=/tmp/vessel-runtime
            /tmp/vessel-transport-host --socket vessel-parent-0 \
              --frame-socket /tmp/vessel-frame-test.sock --input-socket /tmp/vessel-input-test.sock \
              --width 800 --height 540 --refresh 60 >/tmp/transport.log 2>&1 &
            PARENT=$!
            trap "kill $PARENT $LISTENER ${WESTON:-} 2>/dev/null || true" EXIT
            for i in $(seq 1 100); do [ -S /tmp/vessel-runtime/vessel-parent-0 ] && break; sleep .05; done
            test -S /tmp/vessel-runtime/vessel-parent-0
            grep -F "READY socket=vessel-parent-0" /tmp/transport.log

            cat > /tmp/weston.ini <<EOF
            [core]
            shell=desktop-shell.so
            xwayland=true
            repaint-window=7
            idle-time=0
            [shell]
            background-color=0xff08100d
            panel-color=0xe8121b17
            panel-position=top
            locking=false
            animation=none
            close-animation=none
            startup-animation=none
            focus-animation=none
            [autolaunch]
            path=/usr/bin/foot
            watch=false
            EOF

            WAYLAND_DISPLAY=vessel-parent-0 weston \
              --backend=wayland-backend.so --use-pixman \
              --socket=vessel-desktop-ci --display=vessel-parent-0 \
              --width=800 --height=540 --scale=1 --fullscreen \
              --xwayland --idle-time=0 --config=/tmp/weston.ini --log=/tmp/weston.log &
            WESTON=$!
            for i in $(seq 1 160); do [ -S /tmp/vessel-runtime/vessel-desktop-ci ] && break; kill -0 $WESTON 2>/dev/null || break; sleep .05; done
            test -S /tmp/vessel-runtime/vessel-desktop-ci
            kill -0 $WESTON

            WAYLAND_DISPLAY=vessel-desktop-ci timeout 4s foot >/tmp/foot.log 2>&1 &
            FOOT=$!
            sleep 1
            kill -0 $FOOT 2>/dev/null
            wait $FOOT || test $? -eq 124

            for i in $(seq 1 100); do grep -q FRAME_OK /tmp/frame-listener.log 2>/dev/null && break; sleep .05; done
            grep -q FRAME_OK /tmp/frame-listener.log
            grep -F "shm-damage" /tmp/transport.log
            cat /tmp/weston.log
            cat /tmp/frame-listener.log
          '

  build:
    needs: native-wayland-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"
      - name: Verify Android protocol 35 wiring
        run: |
          set -euxo pipefail
          grep -F 'REQUIRED_PROTOCOL = 35' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'weston-nested-vessel-transport-venus-android-surface-v1' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'vessel_runtime_daemon_v35.py' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'fun text(value: String)' app/src/main/java/com/example/dreamlinux/VesselInputClient.kt
          grep -F 'keepScreenOn = false' app/src/main/java/com/example/dreamlinux/VncFramebufferView.kt
      - name: Build, test and lint Vessel app
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --no-configuration-cache
      - name: Upload Vessel APK
        uses: actions/upload-artifact@v4
        with:
          name: vessel-weston-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
