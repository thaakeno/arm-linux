name: Vessel VirtIO GPU protocol 38 APK

on:
  push:
    branches: [ arch/vessel-wlroots-final ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'tools/venus_poc/vessel_runtime_daemon_v38.py'
      - 'tools/venus_poc/guest_command_agent_v38.py'
      - 'tools/venus_poc/vhost_gpu_display_frontend.py'
      - 'tools/venus_poc/patch_vhost_device_gpu_raw_scanout.py'
      - 'tools/venus_poc/build_vhost_device_gpu_termux.sh'
      - 'tools/venus_poc/build_vhost_device_gpu_termux_raw.sh'
      - 'tools/venus_poc/run_vessel_virtio_gpu.sh'
      - 'tools/venus_poc/host_input_bridge.py'
      - '.github/workflows/vessel-native-wayland.yml'
  workflow_dispatch:

concurrency:
  group: vessel-virtio-gpu-v38-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify protocol 38 Plasma direct-DRM runtime
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            tools/venus_poc/vessel_runtime_daemon_v38.py \
            tools/venus_poc/guest_command_agent_v38.py \
            tools/venus_poc/vhost_gpu_display_frontend.py \
            tools/venus_poc/patch_vhost_device_gpu_raw_scanout.py \
            tools/venus_poc/host_input_bridge.py
          bash -n tools/venus_poc/run_vessel_virtio_gpu.sh
          bash -n tools/venus_poc/build_vhost_device_gpu_termux_raw.sh
          grep -F 'PROTOCOL_VERSION = 38' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'v38-virtio-gpu-plasma-r3' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'virtio-gpu-rgb-loopback-android-vulkan-v1' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'VIRTIO_GPU_DRM_READY' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'KWIN_X11_DRM_PLASMA_READY' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'VIRTIO_GPU_VALIDATED_FRAME_REACHED_VESSEL' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'exec startplasma-x11' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'xserver-xorg-core' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'modesetting' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'kmsdev' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F '/dev/dri/card0' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'Xorg :0 -ac -noreset -nolisten tcp -novtswitch -sharevts vt1' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'LIBGL_ALWAYS_SOFTWARE=0' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'GALLIUM_DRIVER=virgl' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'SOFTWARE_RENDERER_REJECTED' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'libinput list-devices' tools/venus_poc/vessel_runtime_daemon_v38.py
          ! grep -E '/lib/elogind|pam_elogind|exec startplasma-wayland|command -v kwin_wayland|pkill .*kwin_wayland' tools/venus_poc/vessel_runtime_daemon_v38.py
          ! grep -E 'command -v kmscube|pkill -x kmscube|kmscube[[:space:]]+-D' tools/venus_poc/vessel_runtime_daemon_v38.py
          grep -F 'UI_SET_PROPBIT' tools/venus_poc/guest_command_agent_v38.py
          grep -F 'INPUT_PROP_DIRECT' tools/venus_poc/guest_command_agent_v38.py
          grep -F 'INPUT_PROP_POINTER' tools/venus_poc/guest_command_agent_v38.py
          grep -F 'VESSEL_RAW_SCANOUT_V2' tools/venus_poc/patch_vhost_device_gpu_raw_scanout.py
          grep -F 'stride = width.checked_mul(4)' tools/venus_poc/patch_vhost_device_gpu_raw_scanout.py
          grep -F 'has_visible_rgb' tools/venus_poc/patch_vhost_device_gpu_raw_scanout.py
          grep -F '.vessel-raw-scanout-v2' tools/venus_poc/run_vessel_virtio_gpu.sh tools/venus_poc/build_vhost_device_gpu_termux_raw.sh
          grep -F '127.0.0.1' tools/venus_poc/vhost_gpu_display_frontend.py
          grep -F '47635' tools/venus_poc/vhost_gpu_display_frontend.py
          grep -F 'virtio_uml.device=' tools/venus_poc/run_vessel_virtio_gpu.sh

      - name: Verify Android protocol 38 integration
        run: |
          set -euxo pipefail
          grep -F 'REQUIRED_PROTOCOL = 38' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'v38-virtio-gpu-plasma-r3' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'direct DRM / VirtIO GPU / VirGL / Adreno' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'guest_command_agent_v38.py' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'vessel_runtime_daemon_v38.py' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'resetPresentationLatch()' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          grep -F 'VesselFrameTcpBridge.start()' app/src/main/java/com/example/dreamlinux/VesselWaylandPresenter.kt
          grep -F 'private const val PORT = 47635' app/src/main/java/com/example/dreamlinux/VesselFrameTcpBridge.kt
          grep -F 'frameValidated && presenter.startsWith("presenting-")' app/src/main/java/com/example/dreamlinux/VmSessionService.kt
          grep -F 'scrollPrecise' app/src/main/java/com/example/dreamlinux/VesselInputClient.kt app/src/main/java/com/example/dreamlinux/VncFramebufferView.kt
          grep -F 'BTN_RIGHT' app/src/main/java/com/example/dreamlinux/VncFramebufferView.kt
          grep -F 'state.progressPercent}%' app/src/main/java/com/example/dreamlinux/VesselActivity.kt
          grep -F 'VirtIO GPU · VirGL · Adreno' app/src/main/java/com/example/dreamlinux/VesselActivity.kt
          grep -F 'keepScreenOn = false' app/src/main/java/com/example/dreamlinux/VncFramebufferView.kt
          grep -F 'FIFO' app/src/main/cpp/vessel_wayland_presenter_v3.cpp
          ! grep -E 'git (clone|fetch)|reset --hard|clean -ffd' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt
          ! grep -F 'Weston 16' app/src/main/java/com/example/dreamlinux/TermuxUmlController.kt app/src/main/java/com/example/dreamlinux/VmSessionService.kt app/src/main/java/com/example/dreamlinux/VesselActivity.kt

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "build-tools;36.0.0"

      - name: Build, test and lint Vessel app
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --no-configuration-cache

      - name: Upload Vessel APK
        uses: actions/upload-artifact@v4
        with:
          name: vessel-protocol38-plasma-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
