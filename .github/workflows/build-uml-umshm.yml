name: Build UML umshm kernel

on:
  push:
    branches:
      - venus-uml-poc
    paths:
      - 'tools/venus_poc/apply_umshm.py'
      - 'tools/venus_poc/fix_umshm_nonblock.py'
      - 'tools/venus_poc/fix_umshm_ptrace_fds.py'
      - 'tools/venus_poc/host_relay_direct.py'
      - 'tools/venus_poc/guest_relay_direct.py'
      - '.github/workflows/build-uml-umshm.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout DreamLinux branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # The hosted runner sometimes ships a temporarily inconsistent
          # Google Chrome apt source. We do not need Chrome for this build,
          # so disable that unrelated source before apt-get update.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make bc bison flex libssl-dev libelf-dev file unzip wget

      - name: Checkout tested UML source
        run: |
          git clone https://github.com/zalexdev/linux-um-arm64.git linux-um-arm64
          cd linux-um-arm64
          git checkout 8897487c52233cd00cf2850008ca068892f1ae91

      - name: Apply umshm source transform
        run: |
          # The phys_mapping source matcher was accidentally written as a raw
          # Python string containing literal "\\t" sequences. Normalize only
          # that matcher block to real tabs before executing the transformer.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/venus_poc/apply_umshm.py')
          s = p.read_text()
          start = s.index("old_phys_mapping = r'''")
          end = s.index("new_phys_mapping = r'''", start)
          s = s[:start] + s[start:end].replace(r'\t', '\t') + s[end:]
          p.write_text(s)
          PY
          python3 tools/venus_poc/apply_umshm.py linux-um-arm64
          python3 tools/venus_poc/fix_umshm_nonblock.py linux-um-arm64
          python3 tools/venus_poc/fix_umshm_ptrace_fds.py linux-um-arm64
          cd linux-um-arm64
          git diff --check
          git diff -- arch/um/drivers/Makefile arch/um/kernel/physmem.c arch/um/drivers/umshm_kern.c arch/um/include/shared/umshm.h arch/um/os-Linux/skas/mem.c arch/um/os-Linux/skas/process.c arch/um/kernel/skas/stub.c arch/um/kernel/skas/stub_exe.c

      - name: Install Android NDK r27c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "NDK=$PWD/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Build static Bionic UML kernel
        run: |
          mkdir -p artifacts
          cd linux-um-arm64
          NDK="$NDK" \
          ART="$GITHUB_WORKSPACE/artifacts" \
          O="$RUNNER_TEMP/uml-umshm-build" \
          bash tools/um-arm64/harness/build-bionic.sh

      - name: Verify outputs
        run: |
          file artifacts/linux-bionic
          file artifacts/stub_exe_bionic
          test -s artifacts/linux-bionic
          test -s artifacts/stub_exe_bionic

      - name: Upload patched UML binaries
        uses: actions/upload-artifact@v4
        with:
          name: uml-umshm-bionic
          path: |
            artifacts/linux-bionic
            artifacts/stub_exe_bionic
            artifacts/build-bionic-*.log
          if-no-files-found: error
